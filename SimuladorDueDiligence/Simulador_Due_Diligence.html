<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador · Due diligence M&amp;A · Peixoto &amp; Cury</title>
<style>
:root{
  --azul:#00A9E0; --escuro:#003B5C;
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#0E2433; --muted:#5A6F7D; --line:#D9E2E8; --soft:#E8F4FA;
  --alto:#C23B2B; --medio:#C98A12; --baixo:#2D8467;
  --alto-bg:#FBE9E6; --medio-bg:#FBF2DF; --baixo-bg:#E3F3ED;
  --rail:#003B5C; --rail-ink:#DCEFF8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071A26; --surface:#0D2534; --ink:#E4EEF4; --muted:#93A9B7; --line:#1F3B4D; --soft:#0F3348;
    --alto:#F07462; --medio:#E8B44A; --baixo:#5CC39C;
    --alto-bg:#3A1C19; --medio-bg:#3A2D12; --baixo-bg:#123128;
    --rail:#021220; --rail-ink:#BFE3F3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071A26; --surface:#0D2534; --ink:#E4EEF4; --muted:#93A9B7; --line:#1F3B4D; --soft:#0F3348;
  --alto:#F07462; --medio:#E8B44A; --baixo:#5CC39C;
  --alto-bg:#3A1C19; --medio-bg:#3A2D12; --baixo-bg:#123128;
  --rail:#021220; --rail-ink:#BFE3F3; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.2}
.brand small{color:var(--rail-ink);opacity:.75;font-size:12px}
.deal-pick label{font-size:12px;opacity:.8;display:block;margin-bottom:4px}
.deal-pick select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;color:#fff}
.deal-pick select option{color:#0E2433}
.rail .ghost{margin-top:8px;width:100%;background:transparent;border:1px dashed rgba(255,255,255,.3);color:var(--rail-ink);border-radius:8px;padding:7px;cursor:pointer}
.rail .ghost:hover{border-color:var(--azul);color:#fff}
.tabs{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.tabs button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--rail-ink)}
.tabs button:hover{background:rgba(255,255,255,.06)}
.tabs button[aria-current="page"]{background:var(--azul);color:#fff;font-weight:600}
.tabs .dot{min-width:22px;height:20px;border-radius:10px;font-size:12px;display:inline-grid;place-items:center;padding:0 6px;background:rgba(255,255,255,.1)}
.tabs .dot.hot{background:var(--alto);color:#fff}
.tabs hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:8px 0}

main{padding:28px 32px 60px;max-width:1240px;width:100%}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.topbar h1{font-size:26px;line-height:1.15;margin:0;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.topbar .meta{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--azul)}
.btn.primary{background:var(--escuro);border-color:var(--escuro);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--azul);border-color:var(--azul);color:#00202F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--azul);border-color:var(--azul);color:#00202F}}
.btn.small{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--azul);padding:4px 6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status-line{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status-line .led{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-line .led.ok{background:var(--baixo)} .status-line .led.err{background:var(--alto)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:16px;margin:0 0 4px;font-weight:600}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.notice{border-left:3px solid var(--azul);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:18px}
.notice.err{border-color:var(--alto);background:var(--alto-bg)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-size:28px;font-weight:600;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v.alto{color:var(--alto)}

/* Risk map: the centerpiece */
.riskmap{width:100%;border-collapse:separate;border-spacing:4px}
.riskmap th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px}
.riskmap th.c{text-align:center}
.riskmap td.area{font-weight:500;font-size:14px;padding:4px 6px;white-space:nowrap}
.riskmap td.area button{all:unset;cursor:pointer;border-bottom:1px dotted var(--muted)}
.riskmap td.area button:hover{color:var(--azul);border-color:var(--azul)}
.cell{border-radius:8px;padding:10px 8px;text-align:center;min-width:92px;height:58px;vertical-align:middle}
.cell .n{font-size:20px;font-weight:600;line-height:1}
.cell .r{font-size:12px;opacity:.85;margin-top:3px}
.cell.zero{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.riskmap td.tot{font-size:13px;text-align:right;padding-right:8px;color:var(--muted);white-space:nowrap}

.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.track .a{background:var(--escuro)} .track .b{background:var(--azul)}
:root[data-theme="dark"] .track .a{background:#4FC7EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .track .a{background:#4FC7EE}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.contg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.contg>div{border:1px solid var(--line);border-radius:10px;padding:12px}
.contg .v{font-size:20px;font-weight:600}
.contg .l{font-size:12px;color:var(--muted)}

/* Tables */
.scroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list td.fname{max-width:360px;word-break:break-word}
table.list .path{color:var(--muted);font-size:12px}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:2px 8px;white-space:nowrap}
.badge.alto{background:var(--alto-bg);color:var(--alto)}
.badge.medio{background:var(--medio-bg);color:var(--medio)}
.badge.baixo{background:var(--baixo-bg);color:var(--baixo)}
.badge.neutral{background:var(--soft);color:var(--muted)}

.finding{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.finding.alto{border-left-color:var(--alto)} .finding.medio{border-left-color:var(--medio)} .finding.baixo{border-left-color:var(--baixo)}
.finding h3{font-size:15px;margin:0 0 4px;font-weight:600}
.finding p{margin:4px 0;font-size:14px;max-width:78ch}
.finding .facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.finding .facts b{color:var(--ink);font-weight:500}
.finding .row-actions{margin-top:6px;display:flex;gap:4px}

.check{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}

.ai{background:var(--soft);border-radius:8px;padding:12px 14px;margin-top:8px;font-size:14px}
.ai .sug{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.ai .sug h4{margin:0 0 4px;font-size:14px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--azul);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.empty{color:var(--muted);font-size:14px;padding:6px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:200px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,30,48,.45)}
.dlg{padding:20px 22px}
.dlg h2{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px}
.form textarea{min-height:80px;resize:vertical}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.results{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.results button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
.results button:hover,.results button[aria-pressed="true"]{background:var(--soft)}
.results small{display:block;color:var(--muted);font-size:12px;word-break:break-all}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--escuro);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw}
.toast[hidden]{display:none}

.hero-empty{max-width:640px}
.hero-empty h1{font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:600}
.hero-empty p{color:var(--muted);max-width:60ch}
.steps{counter-reset:s;padding:0;list-style:none;margin:18px 0}
.steps li{counter-increment:s;padding:8px 0 8px 36px;position:relative;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--azul);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:600}

/* Visão operacional */
.op-chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.op-chip{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.op-chip:hover{border-color:var(--azul)}
.op-chip .v{font-size:22px;font-weight:600;line-height:1.1}
.op-chip .l{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.filters input{min-width:180px;flex:1}
table.list th button{all:unset;cursor:pointer}
table.list th button:hover{color:var(--azul)}
table.list th button[aria-pressed="true"]{color:var(--ink);font-weight:600}
table.list tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.op-sec{scroll-margin-top:80px}

/* Visão executiva: slides 16:9 que escalam pela largura */
.deck-wrap{margin-bottom:14px}
.deck{container-type:inline-size;aspect-ratio:16/9;width:100%;position:relative;overflow:hidden;border-radius:12px;background:#FFFFFF;color:#0E2433;border:1px solid var(--line);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.deck-wrap.presenting{position:fixed;inset:0;z-index:100;background:#00131F;display:grid;place-items:center;margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.deck-wrap.presenting .deck{width:min(100vw,177.78vh);border:0;border-radius:0}
.deck-wrap .exit{display:none}
.deck-wrap.presenting .exit{display:block;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:101;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer}
.deck-wrap.presenting .navzone{position:fixed;top:0;bottom:0;width:30vw;z-index:100;cursor:pointer}
.deck-wrap .navzone{display:none}
.deck-wrap.presenting .navzone{display:block}
.sl{position:absolute;inset:0;padding:5cqw 6cqw 7cqw;display:flex;flex-direction:column}
.sl h2{font-size:3.1cqw;line-height:1.12;margin:0 0 .6cqw;font-weight:600;color:#003B5C;letter-spacing:-.01em;max-width:80%}
.sl .lead{font-size:1.55cqw;color:#4A6272;margin:0 0 2.2cqw;max-width:70%}
.sl .foot{position:absolute;left:6cqw;right:6cqw;bottom:2.6cqw;display:flex;justify-content:space-between;font-size:1cqw;color:#7A8E9B;border-top:.1cqw solid #D9E2E8;padding-top:1cqw}
.sl .rule{width:5cqw;height:.45cqw;background:#00A9E0;margin-bottom:1.5cqw}
.sl.cover{background:#003B5C;color:#fff;justify-content:flex-end;padding-bottom:9cqw}
.sl.cover .mk{position:absolute;top:5cqw;left:6cqw;width:5.5cqw;height:5.5cqw;border-radius:1cqw;background:#00A9E0;color:#fff;font-weight:700;font-size:1.7cqw;display:grid;place-items:center}
.sl.cover .firm{position:absolute;top:6.3cqw;left:13.2cqw;font-size:1.4cqw;color:#CFEAF6}
.sl.cover .kind{font-size:1.5cqw;color:#7FD4F0;margin-bottom:1cqw}
.sl.cover h1{font-size:5.6cqw;line-height:1.02;margin:0 0 2cqw;font-weight:600;letter-spacing:-.02em}
.sl.cover .facts{display:flex;gap:4cqw;font-size:1.4cqw;color:#CFEAF6}
.sl.cover .facts b{display:block;color:#fff;font-size:1.9cqw;font-weight:500;margin-top:.3cqw}
.sl.cover .band{position:absolute;right:0;top:0;bottom:0;width:1.2cqw;background:#00A9E0}
.sl.cover .foot{color:#8FB6CC;border-color:rgba(255,255,255,.15)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-bottom:2.6cqw}
.big3>div{border-top:.35cqw solid #003B5C;padding-top:1.2cqw}
.big3 .v{font-size:4.4cqw;font-weight:600;line-height:1;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.big3 .l{font-size:1.3cqw;color:#4A6272;margin-top:.6cqw}
.lights{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqw 2cqw}
.lights>div{display:flex;align-items:center;gap:1cqw;font-size:1.45cqw}
.lights i{width:1.6cqw;height:1.6cqw;border-radius:50%;flex:none}
.lights small{display:block;color:#7A8E9B;font-size:1.1cqw}
.xmap{border-collapse:separate;border-spacing:.5cqw;width:100%;font-size:1.35cqw}
.xmap th{font-weight:500;color:#7A8E9B;text-align:center;font-size:1.15cqw}
.xmap th:first-child{text-align:left}
.xmap td.a{font-weight:500;white-space:nowrap;padding-right:1cqw}
.xmap td.c{text-align:center;border-radius:.6cqw;height:3.55cqw;line-height:1.1}
.xmap td.c b{font-size:1.65cqw;display:block}
.xmap td.c span{font-size:1.05cqw}
.xmap td.t{text-align:right;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#003B5C;font-weight:600}
.xtab{width:100%;border-collapse:collapse;font-size:1.3cqw}
.xtab th{text-align:left;font-weight:500;color:#7A8E9B;font-size:1.05cqw;padding:.6cqw .8cqw;border-bottom:.12cqw solid #D9E2E8}
.xtab td{padding:.9cqw .8cqw;border-bottom:.1cqw solid #E6EDF1;vertical-align:top}
.xtab td.v{text-align:right;white-space:nowrap;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:600}
.xtab .pill{display:inline-block;font-size:1cqw;padding:.2cqw .7cqw;border-radius:.4cqw;font-weight:600;white-space:nowrap}
.prot{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin-bottom:2cqw}
.prot>div{background:#F1F7FA;border-radius:.8cqw;padding:1.4cqw 1.6cqw}
.prot .v{font-size:2.6cqw;font-weight:600;color:#003B5C;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.prot .l{font-size:1.25cqw;color:#4A6272}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;flex:1;min-height:0}
.cols2 h3{font-size:1.5cqw;margin:0 0 .8cqw;color:#003B5C}
.cols2 ul{margin:0;padding-left:1.6cqw;font-size:1.3cqw;line-height:1.45}
.cols2 li{margin-bottom:.5cqw}
.cols2 li small{color:#7A8E9B}
.hbars{display:flex;flex-direction:column;gap:1.05cqw}
.hbar{display:grid;grid-template-columns:16cqw 1fr 11cqw;gap:1.2cqw;align-items:center;font-size:1.35cqw}
.hbar .tr{height:2cqw;display:flex;background:#F1F5F8;border-radius:.3cqw;overflow:hidden}
.hbar .tr span{display:block;height:100%}
.hbar .val{text-align:right;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:600;color:#003B5C}
.xleg{display:flex;gap:2cqw;font-size:1.1cqw;color:#4A6272;margin-top:1.6cqw}
.xleg i{display:inline-block;width:1.1cqw;height:1.1cqw;border-radius:.2cqw;margin-right:.5cqw;vertical-align:-.1cqw}
.sl.area{padding-top:3.6cqw}
.akind{font-size:1.25cqw;font-weight:600;color:#00A9E0;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5cqw}
.afacts{font-size:1.2cqw;color:#4A6272;margin:0 0 1.6cqw}
.acards{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;align-items:start}
.acards.one{grid-template-columns:1fr}
.acards.one .acard .ah b{font-size:1.6cqw}
.acards.one .acard p{font-size:1.32cqw}
.acards.one .acard p.fund{font-size:1.2cqw}
.acards.one .acard .af{font-size:1.15cqw}
.abase{font-size:1.05cqw;color:#5E7484;margin:1cqw 0 0;line-height:1.4}
.abase b{color:#24394A;font-weight:600}
.acard{border:.1cqw solid #E1E9EE;border-left:.45cqw solid #7A8E9B;border-radius:.6cqw;padding:1cqw 1.3cqw;display:flex;flex-direction:column;gap:.45cqw;height:100%}
.sl .pill{display:inline-block;font-size:1cqw;padding:.2cqw .7cqw;border-radius:.4cqw;font-weight:600;white-space:nowrap}
.sl h2.ah2{font-size:2.35cqw;max-width:92%}
.acard .ah{display:flex;justify-content:space-between;gap:1cqw;align-items:flex-start}
.acard .ah b{font-size:1.38cqw;font-weight:600;line-height:1.2;color:#0E2433}
.acard p{margin:0;font-size:1.13cqw;line-height:1.4;color:#24394A}
.acard p.fund{color:#5E7484;font-size:1.05cqw}
.acard .af{margin-top:auto;display:flex;flex-wrap:wrap;gap:.3cqw 1.4cqw;font-size:1.02cqw;color:#003B5C;font-weight:500;padding-top:.4cqw;border-top:.1cqw solid #EEF3F6}
.anote{font-size:1.05cqw;color:#5E7484;margin:1cqw 0 0;line-height:1.4}
.sl.ov{flex-direction:row;padding:0;gap:0}
.ovl{width:44%;background:#003B5C;color:#fff;padding:4.2cqw 3.6cqw 8cqw 6cqw;display:flex;flex-direction:column;position:relative}
.ovl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1cqw;background:var(--fz)}
.sl.ov .foot{left:calc(44% + 4cqw)}
.ovv.nv{font-size:2.6cqw;color:#7A8E9B}
.ovl h2{color:#fff;font-size:1.9cqw;line-height:1.32;max-width:100%;margin:1.4cqw 0 1.6cqw;font-weight:500}
.fzpill{display:inline-flex;align-items:center;gap:.8cqw;align-self:flex-start;background:rgba(255,255,255,.1);border:.1cqw solid rgba(255,255,255,.25);border-radius:2cqw;padding:.45cqw 1.3cqw .45cqw .8cqw;font-size:1.25cqw;font-weight:600;margin-top:.8cqw}
.fzpill i{width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--fz);box-shadow:0 0 0 .35cqw rgba(255,255,255,.12)}
.ovl .esc{font-size:1.15cqw;line-height:1.5;color:#CFE3EE;margin:0 0 .9cqw}
.ovl .esc b{color:#fff;font-weight:600}
.ovr{flex:1;padding:5cqw 6cqw 8cqw 4cqw;display:flex;flex-direction:column}
.ovk{font-size:1.15cqw;font-weight:600;color:#7A8E9B;text-transform:uppercase;letter-spacing:.07em}
.ovv{font-size:4.6cqw;font-weight:600;color:#003B5C;line-height:1.05;margin:.4cqw 0 1.1cqw;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.ovbar{display:flex;height:1.5cqw;border-radius:.3cqw;overflow:hidden;background:#EEF3F6}
.ovbar span{display:block;height:100%}
.ovleg{display:flex;gap:1.8cqw;font-size:1.1cqw;color:#4A6272;margin:.8cqw 0 1.6cqw;flex-wrap:wrap}
.ovleg i{display:inline-block;width:1cqw;height:1cqw;border-radius:.2cqw;margin-right:.5cqw;vertical-align:-.05cqw}
.ovchips{display:flex;gap:.8cqw;flex-wrap:wrap}
.ovchips div{border-radius:.6cqw;padding:.6cqw 1.1cqw;font-size:1.1cqw;font-weight:500}
.ovchips b{font-size:1.6cqw;margin-right:.5cqw;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.ovt{margin-top:.8cqw;border-top:.1cqw solid #E1E9EE}
.ovt div{display:flex;justify-content:space-between;gap:1cqw;padding:.75cqw 0;border-bottom:.1cqw solid #E1E9EE;font-size:1.3cqw}
.ovt small{color:#7A8E9B}
.ovt b{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#003B5C}
.aval{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:1.9cqw;font-weight:600;white-space:nowrap;line-height:1}
.atags{display:flex;gap:.5cqw;flex-wrap:wrap}
.fztab{width:100%;border-collapse:collapse;font-size:1.18cqw;margin-top:.6cqw}
.fztab th{text-align:left;font-weight:500;color:#7A8E9B;font-size:1cqw;padding:.4cqw .7cqw;border-bottom:.12cqw solid #D9E2E8}
.fztab td{padding:.62cqw .7cqw;border-bottom:.1cqw solid #E6EDF1;vertical-align:middle;line-height:1.35}
.fztab td.v{text-align:right;white-space:nowrap;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:600;color:#003B5C}
.fztab .fza{font-weight:600;white-space:nowrap}
.fztab .fza small{display:block;font-weight:400;color:#7A8E9B;font-size:1cqw}
.fzdot{display:block;width:1.7cqw;height:1.7cqw;border-radius:50%}
.deck-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.deck-nav .pos{font-size:13px;color:var(--muted);min-width:60px;text-align:center}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.thumbs button{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.thumbs button[aria-current="true"]{border-color:var(--azul);background:var(--soft);font-weight:600}

/* ===== Apresentação executiva (padrão P&C de apresentação) ===== */
.xd{--deep:#14324e;--cyan:#00A9E0;--teal:#0090C4;--coral:#c0483a;--amber:#d99029;--mint:#1a7f52;--xink:#0b2233;--xmuted:#55687c;--xdim:#8b98a8;--xline:#e3e9f0;--xline2:#cfd9e3;
  position:relative;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#132a3f;font-variant-numeric:tabular-nums;margin-bottom:10px}
.xd *{box-sizing:border-box}
.xd-wrap{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(180deg,#eef3f8,#e4ebf2);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.xd-stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.xd .slide{position:absolute;inset:0;overflow:hidden;padding:100px 88px 52px;display:flex;flex-direction:column;
  background:radial-gradient(900px 520px at 92% -10%, rgba(0,169,224,.07), transparent 65%),#fff;
  opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .45s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),visibility .45s}
.xd .slide.back{transform:translateX(-24px)}
.xd .slide.on{opacity:1;visibility:visible;transform:none}
.xd .slide::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(20,50,78,.07) 1px,transparent 1px);background-size:24px 24px;
  -webkit-mask-image:linear-gradient(115deg,transparent 45%,#000 100%);mask-image:linear-gradient(115deg,transparent 45%,#000 100%)}
.xd .slide::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--deep),var(--cyan))}
.xd .chrome{position:absolute;top:28px;left:88px;right:88px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--xdim);z-index:1}

.xd h1,.xd h2{font-weight:800;letter-spacing:-.035em;color:var(--xink);margin:0;text-wrap:balance}
.xd h1{font-size:84px;line-height:.98}
.xd h2{font-size:46px;line-height:1.05;max-width:20ch}
.xd h3{font-weight:700;color:var(--xink);margin:0;line-height:1.25}
.xd p{margin:0;text-wrap:pretty}
.xd .head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:28px;position:relative;z-index:1}
.xd .head p{max-width:44ch;color:var(--xmuted);font-size:18px;line-height:1.45;padding-bottom:4px;text-wrap:balance}
.xd .body{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}
.xd .note{margin-top:auto;padding-top:10px;font-size:13px;color:var(--xdim)}
.xd .rlv{font-size:13px;font-weight:700;color:var(--c);white-space:nowrap}
.xd .xpill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.xd .card{background:#fff;border:1px solid #d8e2ec;border-radius:14px;box-shadow:0 1px 2px rgba(16,42,67,.06)}
/* capa */
.xd .cover{display:grid;grid-template-columns:1fr 540px;gap:36px;flex:1;position:relative;z-index:1}
.xd .cover-l{display:flex;flex-direction:column;justify-content:center}
.xd .kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.xd .cover-l h1{margin:20px 0 22px;max-width:10ch}
.xd .lead{font-size:23px;line-height:1.4;color:var(--xmuted);max-width:26ch}
.xd .cover-meta{display:flex;gap:40px;margin-top:40px;padding-top:20px;border-top:1px solid var(--xline);font-size:14px;color:var(--xdim)}
.xd .cover-meta b{display:block;color:var(--xink);font-weight:700;font-size:15px;margin-top:4px;white-space:nowrap}
.xd .cover-r{display:flex;flex-direction:column;justify-content:center}
.xd .cov-card{padding:20px 26px}
.xd .cov-top{display:flex;justify-content:space-between;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--xline);font-size:13px;color:var(--xmuted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.xd .rrow{display:grid;grid-template-columns:1fr 120px 92px;align-items:center;gap:14px;padding:8px 0;font-size:15px}
.xd .rrow+.rrow{border-top:1px solid #eef2f6}
.xd .rrow b{display:block;font-size:16px;font-weight:800;color:var(--xink);letter-spacing:-.01em}
.xd .rrow small{display:block;font-size:12.5px;color:var(--xmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.xd .rtrack{height:8px;border-radius:4px;background:#eef2f6;overflow:hidden;display:block}
.xd .rtrack i{display:block;height:100%;border-radius:4px;background:var(--c)}
.xd .rrow .rlv{text-align:right}
/* sumário */
.xd .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.xd .strip div{padding:11px 18px;border-radius:12px;background:#fff;border:1px solid #d8e2ec;font-size:13.5px;color:var(--xmuted)}
.xd .strip b{display:block;font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--xink);line-height:1.1}
.xd .strip .hot b{color:var(--coral)} .xd .strip .amb b{color:var(--amber)} .xd .strip .ok b{color:var(--mint)}
.xd .ex3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.xd .ex-c{padding:14px 18px}
.xd .ex-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.xd .who{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:12px;background:#e3f4fb;color:#00739e}
.xd .ex-c h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--xdim);margin:8px 0 3px}
.xd .ex-c p{font-size:14px;line-height:1.42;color:#33475d}
.xd .ex-f{margin-top:14px;font-size:15px;color:#33475d;background:#f2f8fc;border:1px solid #bfe3f3;border-radius:12px;padding:10px 16px;line-height:1.45}
/* farol */
.xd .mf-r{display:flex;flex-direction:column;gap:7px}
.xd .mf-i{display:grid;grid-template-columns:14px 200px 1fr 110px;gap:14px;align-items:center;padding:8px 16px;font-size:14px;color:#33475d;line-height:1.38}
.xd .mf-i .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.xd .mf-i b{display:block;font-weight:800;color:var(--xink);font-size:15.5px}
.xd .mf-i .v{text-align:right;font-weight:800;color:var(--xink);font-size:16px;white-space:nowrap}
.xd .mf-i .v small{display:block;font-size:11.5px;font-weight:600;color:var(--xdim)}
.xd .mf-i[data-act]{cursor:pointer}.xd .mf-i[data-act]:hover{border-color:var(--cyan)}
/* escopo */
.xd .mt3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;align-items:start}
.xd .mq-c{padding:16px 20px}
.xd .mq-c h3{font-size:17px;margin-bottom:10px}

.xd .esc{display:flex;flex-wrap:wrap;gap:6px}
/* mapa */
.xd .hm-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;min-height:0}
.xd .hm{display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));gap:5px;align-content:start}
.xd .hm-h{font-size:14px;font-weight:800;color:var(--xink);padding:0 4px 4px;align-self:end}
.xd .hm-k{font-size:14.5px;font-weight:600;color:#33475d;display:flex;align-items:center}
.xd .hm-c{all:unset;box-sizing:border-box;min-height:46px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;font-size:13.5px;font-weight:700;color:var(--c);cursor:pointer;
  background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);transition:box-shadow .2s,transform .2s}
.xd .hm-c b{font-size:20px;font-weight:800}
.xd .hm-c:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(16,42,67,.10)}

.xd .hm-c.na{background:none;border:1px dashed #d8e2ec;color:#a4b1bf;font-weight:500;cursor:default}
.xd .detail{background:#fff;border:1px solid #d8e2ec;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;overflow:auto}

.xd .dl-i{padding:9px 0;border-top:1px solid var(--xline);font-size:14px;color:#33475d;line-height:1.38}
.xd .dl-i b{color:var(--xink);display:block;font-size:14.5px}
.xd .dl-i .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px}
.xd .dl-i .row span{font-weight:800;color:var(--xink);white-space:nowrap}
.xd .dl-i .row .docb{min-width:0}
/* status dos documentos */
.xd .ds-wrap{flex:1;display:grid;grid-template-columns:1fr 330px;gap:30px;align-items:start}
.xd .sbar{all:unset;box-sizing:border-box;display:grid;grid-template-columns:200px 1fr 60px;gap:16px;align-items:center;padding:7px 0;cursor:pointer;width:100%}
.xd .sbar:hover .sl-n{color:var(--teal)}
.xd .sl-n{font-size:15.5px;font-weight:600;color:#132a3f}
.xd .stk{display:flex;height:22px;border-radius:5px;overflow:hidden;background:#eef2f6}
.xd .stk i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.xd .sbar .n{text-align:right;font-weight:800;font-size:18px;color:var(--xink)}
.xd .stl{display:flex;flex-direction:column;gap:8px}

.xd .stl i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.xd .stl b{margin-left:auto;font-size:22px;font-weight:800;color:var(--xink)}
/* divisória */
.xd .slide.dv{background:radial-gradient(900px 600px at 90% -10%,rgba(0,169,224,.22),transparent 60%),#0b2233;justify-content:center}
.xd .slide.dv::before{background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px)}
.xd .dv .chrome>span:last-child{color:#7fd3f0}
.xd .dv-in{position:relative;z-index:1}
.xd .dv-k{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7fd3f0}
.xd .dv-co{font-size:112px;font-weight:800;letter-spacing:-.045em;line-height:1;color:#fff;margin:14px 0 22px}
.xd .dv-co.long{font-size:84px}
.xd .dv-l{font-size:22px;line-height:1.45;color:#c9d6e2;max-width:52ch}
.xd .dv-n{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:46px;border-top:1px solid rgba(255,255,255,.14)}
.xd .dv-n div{padding:18px 22px 0 0;font-size:15px;color:#9fb3c6}
.xd .dv-n div+div{padding-left:22px;border-left:1px solid rgba(255,255,255,.14)}
.xd .dv-n b{display:block;font-size:38px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.1;margin-bottom:4px;white-space:nowrap}
/* achados */
.xd .open4{flex:1;display:grid;gap:14px;align-content:start}
.xd .oc{padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px;min-height:330px}
.xd .oc.hot{border-color:rgba(192,72,58,.45);box-shadow:0 0 0 3px rgba(192,72,58,.07)}
.xd .oc .xpill{align-self:flex-start}
.xd .oc h3{font-size:18px;line-height:1.22}
.xd .oc .pn{font-size:12.5px;color:var(--xdim);font-weight:600;margin-top:-3px}
.xd .oc p{font-size:14px;color:var(--xmuted);line-height:1.44}
.xd .oc-f{margin-top:auto;display:flex;gap:16px;padding-top:10px;border-top:1px solid var(--xline)}
.xd .oc-f div{font-size:12px;color:var(--xdim)}
.xd .oc-f b{display:block;font-size:18px;white-space:nowrap;font-weight:800;letter-spacing:-.02em;color:var(--xink)}
.xd .oc.hot .oc-f b.v{color:var(--coral)}
.docb{font:inherit;font-size:12.5px;font-weight:700;color:#00739e;background:#eef7fc;border:1px solid #bfe3f3;border-radius:14px;padding:3px 10px;cursor:pointer;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docb:hover{background:#dff1fa}
/* documentos da área */
.xd .dg{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;align-content:start}
.xd .dr{all:unset;box-sizing:border-box;display:grid;grid-template-columns:12px 1fr auto 16px;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--xline);cursor:pointer;font-size:14px;color:#33475d;min-width:0}
.xd .dr:hover{background:#f4f9fc;box-shadow:inset 0 0 0 1.5px var(--cyan);border-radius:6px}
.xd .dr i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.xd .dr span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#132a3f}
.xd .dr span.nm small{font-weight:500;color:var(--xdim);margin-left:6px}
.xd .dr em{font-style:normal;font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
.xd .dr .ic{font-weight:700;color:var(--cyan)}
.xd .leg{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:13px;color:var(--xdim)}
.xd .leg span{display:flex;align-items:center;gap:7px;white-space:nowrap}.xd .leg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.xd .linkline{display:flex;align-items:center;gap:8px;font-size:13px;color:#00739e;background:#f2f8fc;border:1px solid #bfe3f3;border-radius:10px;padding:8px 12px;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* proteções */
.xd .xkpi{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.xd .giant{font-size:112px;font-weight:800;letter-spacing:-.04em;line-height:.9;color:var(--xink);white-space:nowrap}
.xd .giant-sub{font-size:20px;color:var(--xmuted);margin-top:24px;max-width:26ch;line-height:1.4}
.xd .kpi-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--xline)}
.xd .kpi-row:first-child{border-top:1px solid var(--xline)}
.xd .kpi-row span{font-size:16.5px;color:var(--xmuted);white-space:nowrap}
.xd .kpi-row span small{display:block;font-size:13px;color:var(--xdim)}
.xd .kpi-row b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--xink)}
.xd .kpi-row.hot b{color:var(--coral)}
/* barras */
.xd .bars{display:flex;flex-direction:column;gap:13px;flex:1;justify-content:center}
.xd .bar{display:grid;grid-template-columns:240px 1fr 120px;align-items:center;gap:22px}
.xd .bar-l{font-size:17px;font-weight:500;color:#132a3f}
.xd .bar-l small{display:block;font-size:12.5px;color:var(--xdim)}
.xd .bar-t{height:28px;position:relative;border-radius:6px;background:rgba(20,50,78,.04);display:flex;overflow:hidden}
.xd .bar-t i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.xd .bar-v{font-size:24px;font-weight:800;letter-spacing:-.03em;text-align:right;color:var(--xink)}
.xd .bar.peak .bar-v{color:var(--coral)}
/* plano */
.xd .plan{flex:1;display:grid;grid-template-columns:repeat(3,1fr)}
.xd .ph{padding:0 30px 0 0;display:flex;flex-direction:column}
.xd .ph+.ph{padding-left:30px;border-left:1px solid var(--xline)}
.xd .ph .track{height:4px;border-radius:2px;margin-bottom:24px}
.xd .ph .d{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:.95;color:var(--xink)}
.xd .ph .d small{display:block;margin-top:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--xmuted)}
.xd .ph h3{margin:12px 0 16px;font-size:20px}
.xd .ph ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.xd .ph li{font-size:15px;color:var(--xmuted);padding-left:20px;position:relative;line-height:1.42}
.xd .ph li::before{content:"";position:absolute;left:0;top:9px;width:10px;height:1.5px;background:var(--xline2)}
.xd .ph li b{color:var(--xink);font-weight:700}
/* fechamento */
.xd .s-close{justify-content:center}
.xd .close-h{font-size:58px;font-weight:800;letter-spacing:-.035em;line-height:1.04;color:var(--xink);max-width:21ch;position:relative;z-index:1;text-wrap:balance}
.xd .nexts{list-style:none;margin:44px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;position:relative;z-index:1}
.xd .nexts li{font-size:16px;color:var(--xmuted);padding-top:16px;border-top:1px solid var(--xline2);line-height:1.45}
.xd .nexts li b{display:block;color:var(--teal);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.xd .sign{margin-top:42px;font-size:15px;color:var(--xdim);position:relative;z-index:1}
.xd .sign b{color:var(--xink)}
/* barra de navegação */
.xd-ui{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px}
.xd-ui button{all:unset;cursor:pointer;height:34px;min-width:34px;padding:0 10px;border-radius:8px;display:inline-grid;place-items:center;font-size:13.5px;font-weight:600;color:#55687c}
.xd-ui button:hover{background:#eef3f8;color:#0b2233}
.xd-ui .arrow{font-size:20px;padding:0}
.xd-ui .count{font-size:13px;color:#55687c;min-width:56px;text-align:center}
.xd-ui .segs{flex:1;display:flex;gap:3px;max-width:620px;margin:0 auto}
.xd-ui .segs button{flex:1;height:18px;min-width:0;padding:0;display:flex;align-items:center}
.xd-ui .segs button::after{content:"";display:block;width:100%;height:3px;border-radius:2px;background:#cfd9e3}
.xd-ui .segs button.done::after{background:#0090C4}.xd-ui .segs button.cur::after{background:#00A9E0;height:5px}
.xd-ov{position:absolute;inset:0;z-index:5;background:rgba(232,238,244,.98);overflow:auto;padding:24px;display:none;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-content:start;border-radius:12px}
.xd-ov.open{display:grid}
.xd-ov .thumb{all:unset;cursor:pointer;position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid #cfd9e3;background:#fff}
.xd-ov .thumb:hover,.xd-ov .thumb.cur{border-color:#00A9E0;box-shadow:0 0 0 2px #00A9E0}
.xd-ov .thumb .inner{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none}
.xd-ov .thumb .inner .slide{opacity:1;visibility:visible;transform:none;transition:none}
.xd-ov .thumb>span{position:absolute;left:8px;bottom:6px;font-size:11.5px;color:#55687c;background:rgba(255,255,255,.95);padding:2px 7px;border-radius:4px;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.xd.presenting{position:fixed;inset:0;z-index:200;margin:0;background:#e4ebf2;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.xd.presenting .xd-wrap{flex:1;aspect-ratio:auto;border-radius:0;border:0}
.xd.presenting .xd-ui{margin:0;border-radius:0;border-width:1px 0 0}
.xd.presenting .xd-ov{border-radius:0;bottom:50px}
@media (max-width:700px){.xd-ui .segs{display:none}}
@media (prefers-reduced-motion:reduce){.xd .slide,.xd .stk i,.xd .bar-t i{transition:none}}

.xd .mq2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.xd .xdl{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;margin:0;font-size:15px}
.xd .xdl dt{color:var(--xdim);font-weight:600}.xd .xdl dd{margin:0;color:#33475d;line-height:1.4}
.xd .xdocs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
/* checklist com documentos */
.ckbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin:4px 0 10px}
.ckbar span{display:block;height:100%}
.ckrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);border-left:3px solid var(--c);padding-left:12px}
.ckrow:last-child{border-bottom:0}
.ckrow .t{font-weight:500;font-size:14.5px}
.ckrow .links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 2px 2px 10px;font-size:12.5px;max-width:100%}
.lchip.up{border-style:dashed}
.lchip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lchip .o{all:unset;cursor:pointer;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.lchip .o:hover{color:var(--azul)}
.lchip .x{all:unset;cursor:pointer;color:var(--muted);padding:0 7px;font-size:15px;line-height:1}
.lchip .x:hover{color:var(--alto)}
.ckact{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--azul);padding:3px 10px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--azul) 55%,transparent);white-space:nowrap}
.ckact:hover{background:var(--soft)}
.ckact.busy{opacity:.6;pointer-events:none}
.cknone{font-size:12.5px;color:var(--muted)}
#linkList{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
#linkList button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
#linkList button:hover{background:var(--soft)}
#linkList button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
#linkList button small{display:block;color:var(--muted);font-size:12px}
#linkList button em{font-style:normal;font-size:12px;color:var(--c);font-weight:600}
#linkList h5{margin:0;padding:8px 12px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
/* ===== Visualizador de documentos ===== */
.paper.html{white-space:normal;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.55;position:relative;overflow:hidden}
.paper.html::after{content:"DOCUMENTO FICTÍCIO";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);font-size:64px;font-weight:800;color:rgba(20,50,78,.05);white-space:nowrap;pointer-events:none;letter-spacing:.04em}
.ddoc .dd-h{display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:2px solid #14324e;padding-bottom:10px;margin-bottom:18px}
.ddoc .dd-h b{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#14324e}
.ddoc .dd-h span{font-size:12px;color:#8b98a8;margin-top:2px}
.ddoc h1{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;text-align:center;color:#0b2233;margin:6px 0 16px;line-height:1.3}
.ddoc h1 small{display:block;font-size:14px;font-weight:400;color:#55687c}
.ddoc p{margin:0 0 10px}
.ddoc .dd-c{background:#f6f9fc;border:1px solid #e3e9f0;border-radius:6px;padding:8px 12px}
.ddoc .dd-cl{text-align:justify}
.ddoc .dd-cl.hl{background:#fff6d6;box-shadow:-4px 0 0 #d99029;padding:4px 8px;border-radius:2px}
.ddoc .dd-t{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
.ddoc .dd-t th{background:#14324e;color:#fff;text-align:left;font-weight:600;padding:6px 8px}
.ddoc .dd-t td{border-bottom:1px solid #e3e9f0;padding:6px 8px;vertical-align:top}
.ddoc .dd-t.sm{font-size:12px}
.ddoc .dd-note{border:1px dashed #b8c4d0;background:#fbfcfe;border-radius:6px;padding:8px 12px;margin:10px 0;font-size:13px;color:#33475d}
.ddoc .dd-stamp{display:inline-block;margin:14px 0 4px;transform:rotate(-4deg);border:3px solid var(--c);color:var(--c);font-weight:800;letter-spacing:.12em;padding:6px 16px;border-radius:6px;font-size:15px}
.ddoc .dd-s{font-size:12px;color:#8b98a8}
.ddoc .dd-sig{display:flex;gap:40px;margin-top:34px;flex-wrap:wrap}
.ddoc .dd-sig div{flex:1;min-width:180px;text-align:center;font-size:12.5px;color:#33475d}
.ddoc .dd-sig i{display:block;border-top:1px solid #33475d;margin-bottom:4px;height:22px;background:linear-gradient(transparent 60%,transparent);position:relative}
.ddoc .dd-org{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.ddoc .dd-org div{border:1.5px solid #14324e;border-radius:8px;padding:10px 18px;text-align:center;font-weight:700;color:#0b2233;min-width:260px}
.ddoc .dd-org div.hl{background:#e3f4fb;border-color:#00A9E0}
.ddoc .dd-org small{font-weight:500;color:#55687c}
.ddoc .dd-org span{font-size:12.5px;color:#55687c}

.dview{position:fixed;inset:0;z-index:300;background:rgba(11,34,51,.62);display:grid;place-items:center;padding:24px;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.dview[hidden]{display:none}
.dbox{width:min(1120px,96vw);height:min(90vh,980px);background:#fff;color:#132a3f;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #e3e9f0;font-weight:700;color:#0b2233;flex-wrap:wrap}
.dbar .dn{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.dbar .dopen{margin-left:auto;font-size:14px;font-weight:700;color:#00739e;text-decoration:none;background:#eef7fc;border:1px solid #bfe3f3;border-radius:16px;padding:5px 12px;cursor:pointer}
.dbar .dopen[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.dbar .dx{all:unset;cursor:pointer;font-size:24px;line-height:1;color:#55687c;padding:0 4px}
.dlink{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:13px;color:#00739e;background:#f2f8fc;border-bottom:1px solid #e3e9f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlink a{color:#00739e;text-decoration:underline;text-underline-offset:2px;overflow:hidden;text-overflow:ellipsis}
.dlink span.crumb{overflow:hidden;text-overflow:ellipsis}
.dmain{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr}
.dmeta{border-right:1px solid #e3e9f0;padding:18px 20px;overflow:auto;font-size:14px;color:#33475d}
.dmeta dl{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:0}
.dmeta dt{font-weight:700;color:#0b2233}.dmeta dd{margin:0;line-height:1.4;word-break:break-word}
.dmeta h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#8b98a8;margin:18px 0 8px}
.dmeta .fi{border-left:3px solid var(--c);padding:6px 10px;margin-bottom:8px;background:#f7fafc;border-radius:0 8px 8px 0}
.dmeta .fi b{display:block;color:#0b2233;font-size:13.5px}
.dmeta .fi span{font-size:12.5px;color:#55687c}
.stp{display:inline-block;padding:3px 10px;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.dprev{background:#e9eef3;overflow:auto;padding:24px}
.paper{background:#fff;max-width:720px;margin:0 auto;min-height:100%;padding:44px 52px;box-shadow:0 2px 10px rgba(16,42,67,.14);font-family:Georgia,"Times New Roman",serif;color:#1b2a36;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.paper .ph1{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b98a8;border-bottom:1px solid #e3e9f0;padding-bottom:10px;margin-bottom:22px;white-space:normal}
.paper .pnote{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13px;color:#8b98a8;white-space:normal;margin-top:24px;border-top:1px solid #e3e9f0;padding-top:10px}
@media (max-width:760px){.dmain{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dmeta{border-right:0;border-bottom:1px solid #e3e9f0;max-height:40vh}.paper{padding:26px 22px}}
/* status de documento na plataforma */
select.stsel{border-color:color-mix(in srgb,var(--c) 55%,var(--line));color:var(--c);font-weight:600;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.fopen{all:unset;cursor:pointer;color:var(--ink);font-weight:500;border-bottom:1px dotted var(--muted)}
.fopen:hover{color:var(--azul);border-color:var(--azul)}
.stleg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.stleg span{display:inline-flex;align-items:center;gap:6px}.stleg i{width:9px;height:9px;border-radius:50%;background:var(--c)}

@media (max-width:900px){
  .op-chips{grid-template-columns:repeat(2,1fr)}
  .deck-nav .btn.primary{margin-left:0}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;z-index:10;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .brand{margin-bottom:10px}
  .tabs{flex-direction:row;overflow-x:auto;margin-top:10px;gap:4px;padding-bottom:2px}
  .tabs li{flex:0 0 auto}
  .tabs hr{display:none}
  .tabs button{white-space:nowrap;gap:8px}
  main{padding:18px 14px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 56px}
  .form{grid-template-columns:1fr}
  .contg{grid-template-columns:1fr}
}
</style>

.brand .ar{margin-top:18px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#00AEEF;font-weight:700}

.tabs button[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:#00AEEF}
.topbar h1{font-weight:800;color:var(--head);letter-spacing:-.2px}
.hero-empty h1{font-weight:800;color:var(--head);letter-spacing:-.2px}
.panel{border-radius:10px;box-shadow:0 1px 3px rgba(0,59,92,.08)}
.panel h2{font-size:14px;font-weight:700;color:var(--head)}
.panel .sub{font-size:12px}
.kpis{border-radius:10px;box-shadow:0 1px 3px rgba(0,59,92,.08);border-top:3px solid var(--escuro)}
.kpi .v{font-weight:800;color:var(--head)}.kpi .v.alto{color:var(--alto)}
.kpi .l{font-size:13px;font-weight:600;color:var(--ink)}
.op-chip{border-radius:10px;box-shadow:0 1px 3px rgba(0,59,92,.08)}.op-chip .v{font-weight:800;color:var(--head)}
.contg .v,.cell .n{font-weight:800}
.btn{font-weight:600;font-size:12.5px;color:var(--head)}
.btn.primary{color:#fff}
.badge{border-radius:10px;font-size:11px;font-weight:700}
table.list th,.riskmap th{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.finding h3{font-weight:700;color:var(--head)}
.finding .facts b{font-weight:700}
.notice{border-left-color:var(--azul)}
.xd h1,.xd h2{letter-spacing:-.02em}
.rail .ghost{font-size:12.5px;font-weight:600;padding:8px}

<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="lg" role="img" aria-label="Peixoto &amp; Cury Advogados"></div><div class="ar">Due diligence M&amp;A</div><small>Simulação com dados fictícios</small></div>
    <div class="deal-pick">
      <label for="dealSel">Operação</label>
      <select id="dealSel"><option value="">Nenhuma operação</option></select>
      <button class="ghost" id="newDealBtn" type="button">+ Nova operação</button>
      <button class="ghost" type="button" data-act="resetDemo" style="border-style:solid;opacity:.75">Restaurar dados de demonstração</button>
    </div>
    <ul class="tabs" id="tabs"></ul>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dealDlg">
  <form class="dlg" method="dialog" id="dealForm">
    <h2 id="dealDlgTitle">Nova operação</h2>
    <div class="form">
      <label class="full">Nome da operação<input name="name" required placeholder="Ex.: Aquisição Alfa Energia"></label>
      <label>Empresa-alvo<input name="target" placeholder="Razão social"></label>
      <label>Cliente (comprador)<input name="client"></label>
      <label>Data-base<input name="baseDate" type="date"></label>
      <label>Valor da operação (R$)<input name="dealValue" type="number" min="0" step="1000"></label>
      <label>Diligência concluída em<input name="concluida" type="date"></label>
      <label class="full">Conclusão do relatório<textarea name="conclusao" placeholder="Aparece no último slide da visão executiva. A primeira frase vira o título."></textarea></label>
      <div class="full">
        <label for="folderQ">Pasta do data room no OneDrive</label>
        <div style="display:flex;gap:8px;margin-top:4px">
          <input id="folderQ" placeholder="Buscar pasta pelo nome" style="flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px">
          <button class="btn" type="button" id="folderSearchBtn">Buscar</button>
        </div>
        <div id="folderResults"></div>
        <p class="sub" id="folderChosen" style="margin:8px 0 0"></p>
      </div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok" id="dealSave">Salvar operação</button>
    </div>
  </form>
</dialog>

<dialog id="linkDlg">
  <form class="dlg" method="dialog">
    <h2>Vincular documento do OneDrive</h2>
    <p class="sub" style="margin:-8px 0 10px">Item do checklist: <b id="linkTitle"></b></p>
    <input id="linkQ" type="search" placeholder="Buscar pelo nome do arquivo ou pasta" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink)">
    <div id="linkList"></div>
    <div class="dlg-actions"><button class="btn" value="cancel">Fechar</button></div>
  </form>
</dialog>
<dialog id="findDlg">
  <form class="dlg" method="dialog" id="findForm">
    <h2 id="findDlgTitle">Registrar achado</h2>
    <div class="form">
      <label class="full">Título<input name="titulo" required></label>
      <label>Área<select name="area"></select></label>
      <label>Risco<select name="risco"><option value="alto">Alto</option><option value="medio" selected>Médio</option><option value="baixo">Baixo</option></select></label>
      <label>Probabilidade de perda<select name="probabilidade"><option value="provavel">Provável</option><option value="possivel" selected>Possível</option><option value="remota">Remota</option></select></label>
      <label>Valor estimado (R$)<input name="valor" type="number" min="0" step="0.01"></label>
      <label>Tratamento no contrato<select name="tratamento">
        <option value="indenizacao">Indenização específica</option>
        <option value="ajuste_preco">Ajuste de preço</option>
        <option value="escrow">Escrow / retenção</option>
        <option value="condicao_precedente">Condição precedente</option>
        <option value="declaracao">Declaração e garantia</option>
        <option value="covenant">Obrigação pós-fechamento</option>
        <option value="nenhum">Sem tratamento</option>
      </select></label>
      <label>Situação<select name="status"><option value="aberto">Aberto</option><option value="negociacao">Em negociação</option><option value="mitigado">Mitigado</option></select></label>
      <label class="full">Descrição<textarea name="descricao"></textarea></label>
      <label class="full">Fundamento / recomendação<textarea name="fundamento"></textarea></label>
      <label class="full">Documento de origem<input name="docName" readonly placeholder="Registrado a partir de um documento do OneDrive"></label>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok">Salvar achado</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const brl = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brlShort = v => { v=Number(v)||0; if(v>=1e9) return "R$\u00a0"+(v/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1})+" bi"; if(v>=1e6) return "R$\u00a0"+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi"; if(v>=1e3) return "R$\u00a0"+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+" mil"; return brl(v); };
const size = b => { b=Number(b)||0; if(b>1e6) return (b/1e6).toFixed(1).replace(".",",")+" MB"; if(b>1e3) return Math.round(b/1e3)+" KB"; return b+" B"; };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }

function matchArea(name){
  const n = norm(name);
  for(const id of MATCH_ORDER){ if(AREA[id].kw.some(r => r.test(n))) return id; }
  return null;
}

// ---------- Persistence ----------
const deal = () => S.deals.find(d => d.id === S.dealId) || null;

async function write(path, data, merge=true){
  if(!S.db){
    const [col, id, sub, sid] = path.split("/");
    if(!sub){ mem.deals[id] = merge ? {...(mem.deals[id]||{}), ...data, id} : {...data, id}; }
    else { const bucket = mem[sub==="files"?"files":sub]; bucket[id] ||= {}; bucket[id][sid] = merge ? {...(bucket[id][sid]||{}), ...data, id:sid} : {...data, id:sid}; }
    loadFromMem(); render(); return;
  }
  try{
    const ref = S.db.doc(path);
    if(merge){ const snap = await ref.get(); if(snap.exists){ await ref.update(data); return; } }
    await ref.set(data);
  }catch(e){
    toast(e && e.code==="invalid_argument" ? "Você não tem permissão para editar esta operação." : "Não foi possível salvar: "+(e && e.message || "erro"));
    throw e;
  }
}
async function remove(path){
  if(!S.db){ const [,id,sub,sid]=path.split("/"); if(!sub) delete mem.deals[id]; else delete mem[sub][id]?.[sid]; loadFromMem(); render(); return; }
  try{ await S.db.doc(path).delete(); }catch(e){ toast("Não foi possível excluir."); }
}
function loadFromMem(){
  S.deals = Object.values(mem.deals).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(S.dealId){
    S.findings = Object.values(mem.findings[S.dealId]||{});
    S.fileDocs = {...(mem.files[S.dealId]||{})};
    S.checklist = {...(mem.checklist[S.dealId]||{})};
  }
}

function subscribeDeal(){
  S.unsub.forEach(u=>{try{u()}catch{}}); S.unsub=[];
  S.findings=[]; S.fileDocs={}; S.checklist={};
  if(!S.dealId){ render(); return; }
  if(!S.db){ loadFromMem(); render(); return; }
  const base = "deals/"+S.dealId;
  S.unsub.push(S.db.collection(base+"/findings").onSnapshot(q => { S.findings = q.docs.map(d=>({...d.data(), id:d.id})); render(); }, dbErr));
  S.unsub.push(S.db.collection(base+"/files").onSnapshot(q => { const m={}; q.docs.forEach(d=>m[d.id]={...d.data()}); S.fileDocs=m; render(); }, dbErr));
  S.unsub.push(S.db.collection(base+"/checklist").onSnapshot(q => { const m={}; q.docs.forEach(d=>m[d.id]={...d.data()}); S.checklist=m; render(); }, dbErr));
}
function dbErr(e){ console.warn(e); toast("Falha ao ler os dados salvos ("+(e&&e.code||"erro")+")."); }

// ---------- OneDrive via Microsoft 365 connector ----------
function resultText(res){
  const blocks = (res && res.content || []).filter(b => b && b.type==="text").map(b => b.text);
  if(blocks.length) return blocks.join("\n");
  if(typeof res?.payload === "string") return res.payload;
  return res?.payload ? JSON.stringify(res.payload) : "";
}
function mcpFail(e, where){
  const c = e && e.code;
  const m = {
    needs_reauth:"A conexão com o Microsoft 365 expirou. Reconecte em Configurações → Conectores no claude.ai.",
    server_not_connected:"Adicione o conector Microsoft 365 em Configurações → Conectores no claude.ai para ler o OneDrive.",
    selection_required:"Há mais de uma conta Microsoft 365 conectada. Escolha qual usar no aviso do claude.ai e tente de novo.",
    not_in_manifest:"O acesso ao Microsoft 365 foi recusado para esta página. Libere em Permissões do artefato.",
    blocked_by_policy:"A política da organização bloqueia esta ação do Microsoft 365.",
    approval_required:"A organização exige aprovação para esta ação do Microsoft 365.",
    server_unavailable:"O Microsoft 365 não respondeu. Tente de novo em instantes.",
    tool_error:"O OneDrive recusou a leitura"+(e&&e.message?": "+e.message:"."),
    not_granted:"Esta visualização não tem acesso aos conectores.",
    capability_disabled:"Esta visualização não tem acesso aos conectores."
  }[c] || ("Falha ao acessar o OneDrive"+(e&&e.message?": "+e.message:"."));
  if(["needs_reauth","server_not_connected","selection_required","not_in_manifest","blocked_by_policy","not_granted","capability_disabled"].includes(c)){ S.mcpState="error"; S.mcpMsg=m; }
  return m;
}
async function callMs(tool, input, cache){
  if(!S.mcp) throw {code:"not_granted", message:"sem conector"};
  try{
    return await S.mcp.callTool(SERVER, tool, input, cache===false?{cache:false}:{cache:{staleTime:60000}});
  }catch(e){
    if(e && e.retryable){ await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*500)); return await S.mcp.callTool(SERVER, tool, input, {cache:false}); }
    throw e;
  }
}
async function listFolder(uri){
  const res = await callMs("read_resource", {uri});
  const text = resultText(res);
  const re = /([^\n]*?)\s*\((folder|file), (\d+) bytes\) (file:\/\/\/[^\/\s]+\/[A-Za-z0-9!_\-]{34})/g;
  const out=[]; let m;
  while((m = re.exec(text))){ const name=m[1].trim(); if(name) out.push({name, type:m[2], size:+m[3], uri:m[4]}); }
  return out;
}
function parseJsonStream(text){
  const out=[]; let depth=0, start=-1, inStr=false, escp=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inStr){ if(escp) escp=false; else if(ch==="\\") escp=true; else if(ch==='"') inStr=false; continue; }
    if(ch==='"'){ inStr=true; continue; }
    if(ch==="{"){ if(depth===0) start=i; depth++; }
    else if(ch==="}"){ depth--; if(depth===0 && start>=0){ try{ out.push(JSON.parse(text.slice(start,i+1))); }catch{} start=-1; } }
  }
  return out;
}
async function searchFolders(q){
  const res = await callMs("sharepoint_folder_search", {name:q, limit:20}, false);
  let items = Array.isArray(res?.payload) ? res.payload : parseJsonStream(resultText(res));
  return items.filter(o => o && o.uri && o.name);
}

async function syncDeal(){
  const d = deal(); if(!d || !d.folderUri || S.syncing) return;
  S.syncing=true; S.syncMsg="Lendo a pasta principal…"; render();
  const files=[]; let calls=0; const MAX_CALLS=80, MAX_FILES=800;
  async function walk(folder, area, path, depth){
    if(calls>=MAX_CALLS || files.length>=MAX_FILES) return;
    calls++; S.syncMsg = "Lendo "+path+" ("+files.length+" arquivos)"; render();
    const items = await listFolder(folder.uri);
    for(const it of items){
      if(it.type==="file"){ files.push({id:itemIdOf(it.uri), name:it.name, size:it.size, uri:it.uri, path, autoArea: area || matchArea(it.name) || matchArea(path)}); }
    }
    for(const it of items){ if(it.type==="folder" && depth<4) await walk(it, area || matchArea(it.name), path+" / "+it.name, depth+1); }
  }
  try{
    await walk({uri:d.folderUri}, null, d.folderName || "Data room", 0);
    S.listing[d.id] = {files, at:Date.now(), partial: calls>=MAX_CALLS || files.length>=MAX_FILES};
    const counts={}; files.forEach(f => { const a = effArea(f); counts[a]=(counts[a]||0)+1; });
    write("deals/"+d.id, {sync:{at:Date.now(), counts, total:files.length}}).catch(()=>{});
    S.mcpState="ok"; toast(files.length+" documentos lidos do OneDrive.");
  }catch(e){ toast(mcpFail(e)); }
  S.syncing=false; S.syncMsg=""; render();
}
const effArea = f => (S.fileDocs[f.id] && S.fileDocs[f.id].area) || f.autoArea || "nc";

// ---------- Claude analysis ----------
async function analyze(f){
  const area = AREA[effArea(f)] || {nome:"geral", id:"nc"};
  S.ai[f.id] = {state:"reading"}; render();
  let text="";
  if(S.demo){ text = f.demoText || ""; } else try{
    const res = await callMs("read_resource", {uri:f.uri, startPage:1, endPage:25});
    text = resultText(res);
  }catch(e){ S.ai[f.id]={state:"error", msg:mcpFail(e)}; render(); return; }
  if(!text.trim()){ S.ai[f.id]={state:"error", msg:"O documento não tem texto legível (pode ser imagem escaneada)."}; render(); return; }
  if(!S.sample){ S.ai[f.id]={state:"error", msg:"A análise com Claude não está disponível nesta visualização."}; render(); return; }
  S.ai[f.id]={state:"thinking"}; render();
  const d = deal()||{};
  const prompt = `Você é advogado(a) sênior de due diligence jurídica em operação de M&A no Brasil, área ${area.nome}.
Operação: ${d.name||""}. Empresa-alvo: ${d.target||"não informada"}. Data-base: ${d.baseDate||"não informada"}.
Analise o documento abaixo ("${f.name}") e identifique contingências, irregularidades e pontos de atenção relevantes para o comprador.
Responda somente com JSON neste formato:
{"resumo":"2 a 3 frases sobre o documento","achados":[{"titulo":"curto","descricao":"o que foi encontrado, com cláusula/página quando houver","risco":"alto|medio|baixo","probabilidade":"provavel|possivel|remota","valor":numero_em_reais_ou_null,"tratamento":"indenizacao|ajuste_preco|escrow|condicao_precedente|declaracao|covenant|nenhum","fundamento":"base legal e recomendação para o contrato de compra e venda"}]}
Escreva como um advogado escreve num memorando: frases curtas, fatos e números do documento, sem adjetivos de reforço, sem travessões e sem expressões como "é importante destacar", "vale ressaltar" ou "cenário". Se não houver achados relevantes, devolva "achados": []. Não invente valores: use null quando o documento não trouxer número.

DOCUMENTO:
${text.slice(0,90000)}`;
  try{
    const out = await S.sample.json(prompt, {modelTier:"complex"});
    const achados = Array.isArray(out?.achados) ? out.achados.filter(a=>a && a.titulo) : [];
    S.ai[f.id] = {state:"done", resumo:String(out?.resumo||""), achados};
    write(`deals/${S.dealId}/files/${f.id}`, {name:f.name, resumo:String(out?.resumo||""), analisadoEm:Date.now(), status: (S.fileDocs[f.id]?.status && S.fileDocs[f.id].status!=="pendente") ? S.fileDocs[f.id].status : "em_analise"}).catch(()=>{});
  }catch(e){
    const msg = e?.code==="not_granted" ? "A análise com Claude não foi autorizada." : e?.code==="rate_limited" ? "Limite de uso atingido. Tente mais tarde." : e?.code==="invalid_json" ? "A resposta veio fora do formato. Tente de novo." : "A análise falhou: "+(e?.message||"erro");
    S.ai[f.id] = {state:"error", msg};
  }
  render();
}

// ---------- Derived ----------
function filesOf(areaId){
  const L = S.listing[S.dealId]; if(!L) return null;
  return L.files.filter(f => effArea(f)===areaId);
}
function areaStats(areaId){
  const fs = S.findings.filter(x=>x.area===areaId);
  const by = {alto:[],medio:[],baixo:[]}; fs.forEach(x => (by[x.risco]||by.medio).push(x));
  const sum = arr => arr.reduce((s,x)=>s+(Number(x.valor)||0),0);
  const prov = sum(fs.filter(x=>x.probabilidade==="provavel" && x.status!=="mitigado"));
  const L = S.listing[S.dealId];
  const total = L ? L.files.filter(f=>effArea(f)===areaId).length : (deal()?.sync?.counts?.[areaId]||0);
  const reviewed = Object.values(S.fileDocs).filter(d => (d.area ? d.area===areaId : true) && ["revisado","com_achado","na"].includes(d.status));
  let rev = 0;
  if(L){ rev = L.files.filter(f=>effArea(f)===areaId && ["revisado","com_achado","na"].includes(S.fileDocs[f.id]?.status)).length; }
  else { rev = Math.min(total, reviewed.filter(d=>d.area===areaId).length); }
  const ck = S.checklist[areaId]?.items || {};
  const items = AREA[areaId].check;
  const got = items.filter((_,i)=>["recebido","na"].includes(ck["i"+i])).length;
  return {fs, by, sum, prov, total, rev, ckGot:got, ckTot:items.length};
}

function opFindings(){

  const by={
    risco:(a,b)=>(RANK[a.risco]-RANK[b.risco])||((b.valor||0)-(a.valor||0)),

    area:(a,b)=>AREAS.findIndex(x=>x.id===a.area)-AREAS.findIndex(x=>x.id===b.area)||(RANK[a.risco]-RANK[b.risco]),
    status:(a,b)=>["aberto","negociacao","mitigado"].indexOf(a.status||"aberto")-["aberto","negociacao","mitigado"].indexOf(b.status||"aberto")||(RANK[a.risco]-RANK[b.risco])
  }[o.sort]||(()=>0);
  return l.sort(by);

const XR = {alto:"194,59,43", medio:"201,138,18", baixo:"45,132,103"};

function execData(){
  const d=deal()||{}, open=S.findings.filter(f=>f.status!=="mitigado");
  const sum=a=>a.reduce((s,x)=>s+(Number(x.valor)||0),0);
  const pr=p=>sum(open.filter(f=>f.probabilidade===p));
  const areas=AREAS.map(a=>{ const fs=open.filter(f=>f.area===a.id); const worst=fs.length?["alto","medio","baixo"].find(r=>fs.some(f=>f.risco===r)):null;
    return {a, fs, worst, all:S.findings.filter(f=>f.area===a.id), prov:sum(fs.filter(f=>f.probabilidade==="provavel")), poss:sum(fs.filter(f=>f.probabilidade==="possivel")), altos:fs.filter(f=>f.risco==="alto").length}; });
  const top=open.slice().sort((a,b)=>(RANK[a.risco]-RANK[b.risco])||((b.valor||0)-(a.valor||0))).slice(0,6);
  const trat=k=>open.filter(f=>f.tratamento===k);
  return {d, open, sum, prov:pr("provavel"), poss:pr("possivel"), rem:pr("remota"), altos:open.filter(f=>f.risco==="alto").length, areas, top, trat, pend:checklistPend()};
}
function cut(s,n){ s=String(s||"").trim(); if(s.length<=n) return s; const c=s.slice(0,n); return c.slice(0,Math.max(c.lastIndexOf(" "),n-20)).replace(/[,;:.\s]+$/,"")+"…"; }
function plural(n,s,p){ return n===1?s:p; }
const ESCOPO={
  civel:"Contratos com clientes e fornecedores relevantes, garantias prestadas, financiamentos e seguros.",
  contencioso:"Processos judiciais, administrativos e arbitrais, prognósticos dos advogados externos e depósitos judiciais.",
  tributario:"Certidões, autos de infração, parcelamentos, benefícios fiscais, compensações e obrigações acessórias dos últimos 5 anos.",
  societario:"Atos constitutivos, livros societários, acordos de sócios, ônus sobre quotas e poderes de representação.",
  trabalhista:"Quadro de empregados, normas coletivas, terceirização, saúde e segurança, cotas legais e passivo trabalhista.",
  ambiental:"Licenças e condicionantes, autuações, passivos de solo e água, outorgas e gestão de resíduos.",
  imobiliario:"Matrículas, ônus reais, locações, IPTU e regularidade das construções e do AVCB.",
  pi:"Marcas, patentes, softwares, domínios e titularidade das criações de empregados."
};
function farol(r){
  if(r.worst==="alto") return {k:"vermelho", cor:"#C23B2B", label:"Risco alto"};
  if(r.worst==="medio") return {k:"amarelo", cor:"#E0A93A", label:"Risco moderado"};
  return {k:"verde", cor:"#2D8467", label:r.fs.length?"Risco baixo":"Sem risco relevante"};
}
function areaConclusao(r){
  const own=(deal()?.conclusoesArea||{})[r.a.id]; if(own && own.trim()) return own.trim().replace(/R\$ /g,"R$\u00a0");
  const fs=r.fs.slice().sort((a,b)=>(RANK[a.risco]-RANK[b.risco])||((b.valor||0)-(a.valor||0)));
  if(!fs.length) return "Nenhuma contingência relevante nos documentos revisados.";
  const m=fs[0], t=m.titulo.charAt(0).toLowerCase()+m.titulo.slice(1);
  if(r.altos) return `${r.altos} ${plural(r.altos,"risco alto","riscos altos")}. O principal é ${t}${m.valor?` (${brlShort(m.valor)})`:""}.`;
  return `Sem risco alto. O ponto mais relevante é ${t}${m.valor?` (${brlShort(m.valor)})`:""}.`;
}

const DOC_ST={pendente:{l:"Pendente",c:"#8b98a8"},em_analise:{l:"Em análise",c:"#0090C4"},revisado:{l:"Revisado",c:"#1a7f52"},com_achado:{l:"Com achado",c:"#c0483a"},na:{l:"Não se aplica",c:"#b8c4d0"}};
const docSt=f=>S.fileDocs[f.id]?.status||"pendente";
const allFilesNow=()=>S.listing[S.dealId]?.files||[];
const fileById=id=>allFilesNow().find(f=>f.id===id);
const fileByName=n=>n?allFilesNow().find(f=>f.name===n):null;
const fileOfFinding=x=>(x.fileId&&fileById(x.fileId))||fileByName(x.docName);
function docLink(f){ const d=deal(); if(!d?.folderWebUrl) return null; const segs=String(f.path||"").split(" / ").slice(1); return d.folderWebUrl.replace(/\/$/,"")+"/"+[...segs,f.name].map(s=>encodeURIComponent(s)).join("/"); }
const docCrumb=f=>["OneDrive",...String(f.path||"").split(" / "),f.name].join(" › ");
S.docText = S.docText || {};
const dview=document.createElement("div"); dview.className="dview"; dview.hidden=true; document.body.appendChild(dview);
function closeDoc(){ dview.hidden=true; dview.innerHTML=""; }
dview.addEventListener("click",e=>{ if(e.target===dview||e.target.closest(".dx")) closeDoc(); const a=e.target.closest(".dopen[aria-disabled='true']"); if(a){ e.preventDefault(); toast("Na demonstração os documentos são fictícios e o link não abre."); } });
document.addEventListener("keydown",e=>{ if(!dview.hidden&&e.key==="Escape"){ e.stopPropagation(); closeDoc(); } },true);
function openDoc(id){
  const f=fileById(id); if(!f){ toast("Documento não encontrado no data room. Atualize do OneDrive."); return; }
  const st=docSt(f), sc=DOC_ST[st]||DOC_ST.pendente, url=docLink(f), fd=S.fileDocs[f.id]||{};
  const fs=S.findings.filter(x=>x.fileId===f.id||x.docName===f.name);
  const area=AREA[effArea(f)];
  dview.innerHTML=`<div class="dbox" role="dialog" aria-modal="true" aria-label="${esc(f.name)}">
    <div class="dbar"><span class="dn">▤ ${esc(f.name)}</span><span class="stp" style="--c:${sc.c}">${esc(sc.l)}</span>
      ${url?`<a class="dopen" href="${esc(url)}" target="_blank" rel="noopener">Abrir no OneDrive ↗</a>`:`<a class="dopen" href="#" aria-disabled="true" title="${S.demo?"Demonstração: link fictício":"Vincule a pasta pela busca do OneDrive para gerar o link"}">Abrir no OneDrive ↗</a>`}
      <button class="dx" aria-label="Fechar">×</button></div>
    <div class="dlink">🔗 ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(docCrumb(f))}</a>`:`<span class="crumb">${esc(docCrumb(f))}</span>`}</div>
    <div class="dmain"><div class="dmeta"><dl>
      <dt>Área</dt><dd>${esc(area?.nome||"Sem área definida")}</dd>
      <dt>Pasta</dt><dd>${esc(f.path||"")}</dd>
      <dt>Tamanho</dt><dd>${size(f.size)}</dd>
      <dt>Revisão</dt><dd><span class="stp" style="--c:${sc.c}">${esc(sc.l)}</span></dd>
      ${fd.analisadoEm?`<dt>Analisado</dt><dd>${new Date(fd.analisadoEm).toLocaleDateString("pt-BR")}</dd>`:""}
    </dl>
    ${fd.resumo?`<h4>Resumo</h4><p style="margin:0;line-height:1.45">${esc(fd.resumo)}</p>`:""}
    <h4>Achados ligados a este documento</h4>${fs.length?fs.map(x=>`<div class="fi" style="--c:${({alto:"#c0483a",medio:"#d99029",baixo:"#1a7f52"})[x.risco]||"#8b98a8"}"><b>${esc(x.titulo)}</b><span>${esc(RISK[x.risco]||"")} · ${x.valor?brlShort(x.valor):"sem valor"} · ${esc(STAT[x.status]||"")}</span></div>`).join(""):`<p style="margin:0;color:#8b98a8">Nenhum.</p>`}
    </div><div class="dprev"><div class="paper" id="dvPaper"></div></div></div></div>`;
  dview.hidden=false;
  fillPaper(f, fs);
}
async function fillPaper(f, fs){
  const el=document.getElementById("dvPaper"); if(!el) return;
  const head=`<div class="ph1">${esc(f.name)} · ${esc(f.path||"")}</div>`;
  const ficha=()=>`${head}<b style="font-family:'Segoe UI',system-ui,Arial,sans-serif">Ficha de revisão</b>\n\n${fs.length?fs.map(x=>`• ${x.titulo}\n${x.descricao||""}`).join("\n\n"):(S.fileDocs[f.id]?.resumo||"Documento revisado sem achados relevantes.")}<div class="pnote">${S.demo?"Demonstração: este documento fictício não tem texto. O painel mostra a ficha de revisão.":"Pré-visualização de texto indisponível para este arquivo."}</div>`;
  if(S.demo){ if(f.demoHtml){ el.classList.add("html"); el.innerHTML=`${head}<div class="ddoc">${f.demoHtml}</div><div class="pnote">Documento fictício criado para a demonstração. Pessoas, empresas, números e processos são inventados.</div>`; } else el.innerHTML = f.demoText ? `${head}${esc(f.demoText)}<div class="pnote">Trecho do documento fictício usado na demonstração.</div>` : ficha(); return; }
  if(S.docText[f.id]!==undefined){ el.innerHTML = S.docText[f.id] ? `${head}${esc(S.docText[f.id].slice(0,60000))}` : ficha(); return; }
  if(!S.mcp){ el.innerHTML=ficha(); return; }
  el.innerHTML=`${head}<span class="spinner"></span>Lendo o documento no OneDrive…`;
  try{ const res=await callMs("read_resource",{uri:f.uri,startPage:1,endPage:15}); S.docText[f.id]=resultText(res)||""; }
  catch(e){ S.docText[f.id]=""; toast(mcpFail(e)); }
  const el2=document.getElementById("dvPaper"); if(el2) el2.innerHTML = S.docText[f.id] ? `${head}${esc(S.docText[f.id].slice(0,60000))}` : ficha();
}

function xdFit(){ const w=$("#xdWrap"), st=$("#xdStage"); if(!w||!st) return; const s=Math.min(w.clientWidth/1280,w.clientHeight/720); st.style.transform=`translate(${(w.clientWidth-1280*s)/2}px,${(w.clientHeight-720*s)/2}px) scale(${s})`; }

function xdGo(n){ const sl=[...document.querySelectorAll("#xdStage>.slide")]; if(!sl.length) return; n=Math.max(0,Math.min(sl.length-1,n)); if(n===S.slide) return; const fw=n>S.slide;

async function ckUpload(input){

function openFindingDlg(existing, file){
  const f=$("#findForm"); f.reset(); S.editingFinding = existing||null;
  f.elements.area.innerHTML = AREAS.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("");
  $("#findDlgTitle").textContent = existing?"Editar achado":"Registrar achado";
  const src = existing || {area: AREA[S.tab]?S.tab:(file?effArea(file):"civel"), docName:file?.name||"", docUri:file?.uri||""};
  ["titulo","area","risco","probabilidade","valor","tratamento","status","descricao","fundamento","docName"].forEach(k=>{ if(src[k]!==undefined && src[k]!==null && src[k]!=="") f.elements[k].value=src[k]; });
  if(f.elements.area.value==="" || !AREA[f.elements.area.value]) f.elements.area.value="civel";
  f.dataset.docUri = src.docUri||""; f.dataset.fileId = file?.id || existing?.fileId || "";
  $("#findDlg").showModal();
}
$("#findDlg").addEventListener("close", async ()=>{

  toast(S.editingFinding?"Achado atualizado.":"Achado registrado.");
});
