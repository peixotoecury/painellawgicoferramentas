document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-tab],[data-act]"); if(!t || t.tagName==="SELECT") return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.filter=""; render(); window.scrollTo({top:0}); return; }
  const act=t.dataset.act;
  if(act==="saveConcl"){ const d=deal(); const m={...(d.conclusoesArea||{})}; m[t.dataset.area]=$("#areaConcl").value.trim(); write("deals/"+d.id,{conclusoesArea:m}).then(()=>toast("Conclusão salva.")).catch(()=>{}); return; }
  if(act==="openDoc"){ openDoc(t.dataset.id); return; }
  if(act==="ckLink"){ openLinkPicker(t.dataset.area,t.dataset.i); return; }
  if(act==="ckPick"){ const tg=S.linkTarget; const f=allFilesNow().find(x=>x.id===t.dataset.id); if(tg&&f){ $("#linkDlg").close(); ckAddLink(tg.area,tg.i,{fileId:f.id,name:f.name}).catch(()=>{}); } return; }
  if(act==="ckUnlink"){ const d=ckData(t.dataset.area); const k="i"+t.dataset.i; const l=(d.links[k]||[])[+t.dataset.j]; if(l&&confirm(`Desvincular "${l.name}" deste item?`)){ d.links[k].splice(+t.dataset.j,1); ckSave(t.dataset.area,d).catch(()=>{}); } return; }
  if(act==="openUpload"){ openUpload(t.dataset.area,t.dataset.i,t.dataset.j); return; }
  if(act==="ckMissing"){ toast("Este documento não apareceu na última leitura do OneDrive. Clique em Atualizar do OneDrive."); return; }
  if(act==="xdPrev"){ xdGo(S.slide-1); return; }
  if(act==="xdNext"){ xdGo(S.slide+1); return; }
  if(act==="xdGo"){ if(t.dataset.ov) xdToggleOv(false); xdGo(+t.dataset.i); return; }
  if(act==="xdOv"){ xdToggleOv(); return; }
  if(act==="xdFs"){ xdFs(); return; }
  if(act==="xdArea"){ xdGoTitle(AREA[t.dataset.a].nome); return; }
  if(act==="xdDocs"){ xdGoTitle(AREA[t.dataset.a].nome+" · documentos"); return; }
  if(act==="hmCell"){ S.hmSel=[t.dataset.a,t.dataset.k]; const det=document.getElementById("hmDetail"); if(det) det.innerHTML=hmDetail(S.hmSel); document.querySelectorAll(".hm-c[data-a]").forEach(b=>b.setAttribute("aria-pressed",String(b===t))); return; }
  if(act==="opSort"){ S.op.sort=t.dataset.k; render(); return; }
  if(act==="opClear"){ Object.assign(S.op,{area:"",risco:"",status:"",trat:"",q:"",semValor:false}); render(); return; }
  if(act==="opJump"){ if(t.dataset.doc){ S.op.docStatus=t.dataset.doc; S.op.docArea=""; } if(t.dataset.st||t.dataset.sv){ Object.assign(S.op,{area:"",risco:"",trat:"",q:"",status:t.dataset.st||"",semValor:!!t.dataset.sv}); } render(); document.getElementById(t.dataset.to)?.scrollIntoView({behavior:"smooth"}); return; }
  const L=S.listing[S.dealId]; const fileById=id=>L?.files.find(f=>f.id===id);
  if(act==="newDeal") openDealDlg(false);
  else if(act==="editDeal") openDealDlg(true);
  else if(act==="sync") syncDeal();
  else if(act==="newFinding") openFindingDlg(null, t.dataset.file?fileById(t.dataset.file):null);
  else if(act==="editFinding") openFindingDlg(S.findings.find(f=>f.id===t.dataset.id));
  else if(act==="delFinding"){ const f=S.findings.find(x=>x.id===t.dataset.id); if(f && confirm(`Excluir o achado "${f.titulo}"?`)) remove(`deals/${S.dealId}/findings/${f.id}`); }
  else if(act==="analyze"){ const f=fileById(t.dataset.id); if(f) analyze(f); }
  else if(act==="acceptSug"){
    const f=fileById(t.dataset.file), a=S.ai[t.dataset.file], s=a?.achados?.[+t.dataset.i]; if(!f||!s) return;
    const data={titulo:String(s.titulo).slice(0,200), area:effArea(f)!=="nc"?effArea(f):"civel", risco:RISK[s.risco]?s.risco:"medio", probabilidade:PROB[s.probabilidade]?s.probabilidade:"possivel", valor:Number(s.valor)||0, tratamento:TRAT[s.tratamento]?s.tratamento:"declaracao", status:"aberto", descricao:String(s.descricao||""), fundamento:String(s.fundamento||""), docName:f.name, docUri:f.uri, fileId:f.id, origem:"claude", createdAt:Date.now(), updatedAt:Date.now()};
    s.added=true; render();
    await write(`deals/${S.dealId}/findings/${uid()}`, data, false).catch(()=>{ s.added=false; render(); });
    write(`deals/${S.dealId}/files/${f.id}`, {status:"com_achado", name:f.name}).catch(()=>{});
  }
  else if(act==="export") exportCSV();
  else if(act==="resetDemo"){ if(confirm("Restaurar os dados fictícios originais? As alterações desta sessão serão perdidas.")){ seedDemo(); toast("Dados fictícios restaurados."); } }
});

async function exportCSV(){
  const d=deal(); const cols=["Área","Título","Risco","Probabilidade","Valor (R$)","Tratamento","Situação","Descrição","Fundamento","Documento"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=S.findings.slice().sort((a,b)=>AREAS.findIndex(x=>x.id===a.area)-AREAS.findIndex(x=>x.id===b.area)).map(f=>[AREA[f.area]?.nome,f.titulo,RISK[f.risco],PROB[f.probabilidade],(Number(f.valor)||0).toFixed(2).replace(".",","),TRAT[f.tratamento],STAT[f.status],f.descricao,f.fundamento,f.docName].map(q).join(";"));
  const csv="\uFEFF"+cols.map(q).join(";")+"\n"+rows.join("\n");
  try{ await S.downloads.save({filename:`achados-${norm(d.name).replace(/[^a-z0-9]+/g,"-")}.csv`, data:csv}); }catch(e){ if(e?.code!=="cancelled" && e?.code!=="declined") toast("O arquivo não foi salvo."); }
}
