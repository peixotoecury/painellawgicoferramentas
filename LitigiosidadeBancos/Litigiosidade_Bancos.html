<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Análise de Litigiosidade dos Bancos Múltiplos | Peixoto e Cury</title>

<style>
:root{
  --bg:#e7ecf3; --card:#fff; --soft:#f7f9fc; --line:#e2e8f0; --line2:#dbe3ec;
  --ink:#14243a; --title:#14324e; --muted:#7c8a9b; --muted2:#5b6675;
  --accent:#00A9E0; --accentH:#0091c2; --deep:#003B5C; --head:#0b2233; --head2:#0E2841;
  --ch1:#1d4d75; --ch2:#163f60; --track:#eef2f7; --hover:#f2f7fb;
  --ok:#1f9d6b; --okbg:#e3f5ec; --warn:#b7791f; --warnbg:#fdf3e1; --bad:#8a94a3; --badbg:#eef1f5;
  --c:#F97316; --cbg:#fff3e9; --a:#EF4444; --abg:#fdecec; --b:#059669;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:'Figtree','Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;margin:0}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
.top{position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(12,36,56,.14)}
.hbar{background:var(--head);display:flex;align-items:center;gap:18px;padding:10px 22px;min-height:62px;flex-wrap:wrap}
.wm{display:flex;flex-direction:column;gap:2px}
.wm .b1{font-size:15px;font-weight:800;letter-spacing:2px;color:#fff;line-height:1}
.wm .b2{font-size:9px;font-weight:600;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
.vsep{width:1px;height:28px;background:rgba(255,255,255,.18)}
.htitle{font-size:12px;font-weight:700;letter-spacing:1.4px;color:#8fa6b8;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabs{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.tabs button{padding:8px 13px;border:none;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;background:transparent;color:#cfe0ee}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs button:hover:not([aria-selected="true"]){background:rgba(255,255,255,.08)}
.pos{text-align:right;line-height:1.25}
.pos .l{font-size:9.5px;font-weight:700;letter-spacing:1px;color:#7c8a9b;text-transform:uppercase}
.pos .v{font-size:13px;font-weight:800;color:#fff}
.pos .n{font-size:9.5px;font-weight:700;color:var(--accent)}
.grad{height:3px;background:linear-gradient(90deg,#00A9E0,#1d4d75)}
/* grid */
.wrap{padding:12px 16px 46px;max-width:1580px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1100px){.s3,.s4,.s5{grid-column:span 6}.s7,.s8{grid-column:span 12}}
@media (max-width:760px){.top{position:static}.grid>*{grid-column:span 12 !important}.hbar{padding:10px 16px}.htitle{display:none}}
.sec{display:flex;align-items:center;gap:12px;margin:20px 0 4px;flex-wrap:wrap;scroll-margin-top:84px}
.sec:first-child{margin-top:4px}
.sec .k{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--accent);text-transform:uppercase}
.sec .t{font-size:19px;font-weight:800;color:var(--title);letter-spacing:-.4px}
.sec .ln{flex:1;height:2px;background:var(--line2);min-width:40px}
.sec .nt{font-size:11.5px;font-weight:600;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-left:5px solid var(--cc,var(--accent))}
.kpi .l{font-size:9.5px;font-weight:800;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.14;color:var(--cc,var(--accent))}
.kpi .v small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .s{font-size:11px;color:var(--muted);line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ch{background:linear-gradient(180deg,var(--ch1),var(--ch2));color:#fff;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 12px;border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cb{padding:12px 14px;flex:1;min-width:0}
.hint{font-size:10.5px;color:var(--muted);margin-top:8px}
/* seg toggles */
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line2);background:var(--card);color:var(--muted2);border-radius:6px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--title);border-color:var(--title);color:var(--card)}
.chhead .seg button{border-color:rgba(255,255,255,.28);background:transparent;color:#cfe0ee}
.chhead .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:5px;padding:3px 9px;font-size:10.5px;font-weight:700;line-height:1.5;display:inline-block}
/* bars */
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.brow .lb{min-width:150px;text-align:right;font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .uf{min-width:44px;font-size:9.5px;color:var(--muted)}
.brow .tr{flex:1;height:9px;background:var(--track);border-radius:4px;overflow:hidden}
.brow .tr span{display:block;height:100%;border-radius:4px}
.brow .vl{min-width:56px;text-align:right;font-size:11.5px;font-weight:800}
/* pills */
.pill{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:800;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.pill-sm{padding:1px 8px;font-size:11px;min-width:36px}
.pill-c{background:var(--cbg);color:var(--c)} .pill-a{background:var(--abg);color:var(--a)} .pill-m{background:var(--warnbg);color:var(--warn)} .pill-n{background:var(--track);color:var(--deep)}
/* resultados */
.resrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.resbox{padding:12px 14px;border-radius:8px;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--cc)}
.resbox .l{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--cc)}
.resbox .v{font-size:24px;font-weight:800;color:var(--cc);margin:3px 0;font-variant-numeric:tabular-nums}
.resbox .s{font-size:10px;color:var(--muted)}
.resbox .mini{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:8px}
.resbox .mini span{display:block;height:100%;border-radius:3px;background:var(--cc)}

.vtabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.vtabs button{border:1px solid var(--line2);background:var(--card);color:var(--muted2);border-radius:6px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer}
.tema{border-bottom:1px solid var(--line);padding:13px 6px;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;cursor:pointer}
.tema:last-child{border-bottom:none}
.tema:hover{background:var(--hover)}
.tema .rk{font-size:18px;font-weight:800;text-align:center}
.tema h4{margin:0 0 4px;font-size:13.5px;color:var(--title);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tema .rs{font-size:12px;color:var(--muted2);line-height:1.55;margin:0}
.tema .rt{text-align:right;min-width:96px}
.tag{font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:4px}
.det{margin-top:12px;padding:14px 16px;background:var(--soft);border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--cc)}
.det .sub{font-size:9px;font-weight:800;letter-spacing:1.4px;margin:14px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.det .sub:first-child{margin-top:0}
.det p{margin:0;font-size:12px;line-height:1.7;color:var(--ink)}
.det ul{padding-left:18px;margin:0;font-size:12px;line-height:1.75;color:var(--muted2)}
.det .box{border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.65}
.ed[contenteditable="true"]{outline:1px dashed var(--accent);outline-offset:2px;border-radius:4px;background:rgba(0,169,224,.06)}
.ebtn{cursor:pointer;font-size:11px;font-weight:700;padding:6px 11px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--muted2)}
.ebtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* normas */
.ncl{border:1px solid var(--line);border-radius:8px;padding:13px 15px;background:var(--card);border-top:4px solid var(--cc,var(--accent));display:flex;flex-direction:column}
.ncl .g{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--cc,var(--accent))}
.ncl h4{margin:4px 0 7px;font-size:14px;color:var(--title);line-height:1.3;font-weight:700}
.ncl .val{font-size:22px;font-weight:800;letter-spacing:-.6px;color:var(--cc,var(--accent));line-height:1.1;font-variant-numeric:tabular-nums}
.ncl .val small{font-size:11px;font-weight:700;color:var(--muted)}
.ncl .rs{font-size:12px;line-height:1.6;color:var(--muted2);margin-top:8px}
.ncl details{margin-top:9px}
.ncl summary{cursor:pointer;font-size:11px;font-weight:800;color:var(--accent);list-style:none}
.ncl summary::-webkit-details-marker{display:none}
.ncl summary::before{content:'▸ '}
.ncl details[open] summary::before{content:'▾ '}
.ncl .tx{font-size:11.5px;line-height:1.65;color:var(--muted2);margin-top:7px;background:var(--soft);border-radius:6px;padding:9px 11px;border:1px solid var(--line)}
.ncl .src{font-size:9.5px;color:var(--muted);margin-top:8px}
.bnk{border:1px solid var(--line);border-radius:8px;padding:13px 15px;background:var(--card);border-top:4px solid var(--cc,var(--deep))}
.bnk .nm{font-weight:800;color:var(--title);font-size:15px}
.bnk .tp{font-size:10.5px;color:var(--muted);margin-top:2px}
.bnk .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.bnk .tags span{font-size:9px;font-weight:700;background:var(--track);color:var(--muted2);border-radius:10px;padding:2px 8px}
.bnk .mm{font-size:11.5px;color:var(--muted2);margin-top:9px;line-height:1.6}
.bnk .lk{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.bnk .lk a{font-size:10.5px;font-weight:700}
.nsrc{display:flex;gap:8px;flex-wrap:wrap}
.nsrc a{display:inline-flex;gap:6px;border:1px solid var(--line2);border-radius:7px;padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--title);background:var(--soft)}
.nsrc a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.note{font-size:10.5px;color:var(--muted);line-height:1.7}
.note b{color:var(--muted2);letter-spacing:1px}
.banner{background:linear-gradient(135deg,var(--head2),var(--head));border-radius:8px;padding:13px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner .em{font-size:22px}
.banner .t1{font-size:13px;color:#fff;font-weight:700;margin-bottom:2px}
.banner .t2{font-size:11px;color:rgba(255,255,255,.62);line-height:1.5}
</style>

.top{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:40;box-shadow:none;background:#001E36;overflow:auto}
.hbar{background:transparent;flex-direction:column;align-items:stretch;gap:0;padding:22px 14px;min-height:100%;flex-wrap:nowrap}
.hbar .pc-lg{margin:0 8px}
.wm,.vsep,.grad{display:none}
.htitle{display:block!important;margin:18px -14px 0;padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);color:#00AEEF;font-size:10.5px;letter-spacing:1.2px;line-height:1.5}
.hright{margin:0;flex:1;display:flex;flex-direction:column;align-items:stretch;gap:0}
.tabs{all:unset;display:flex;flex-direction:column;gap:2px;margin-top:22px}
.tabs button{all:unset;box-sizing:border-box;position:relative;display:block;width:100%;padding:9px 12px 9px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.78);white-space:normal}
.tabs button:hover{background:rgba(255,255,255,.06)}
.tabs button:focus-visible{outline:2px solid #00AEEF;outline-offset:1px}
.tabs button[aria-selected="true"]{background:rgba(0,174,239,.14);color:#fff;font-weight:700}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:#00AEEF}
.pos{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.08);text-align:left}
.pos .l{color:rgba(255,255,255,.45)}
.pos .n{color:#00AEEF}
.wrap{padding:28px 32px 60px;max-width:1440px;margin:0}
.sec{scroll-margin-top:20px}
.sec .k{color:#006080;font-size:10.5px;letter-spacing:1.2px}
.sec .t{font-size:20px;color:#003B5C;letter-spacing:-.2px}
.card,.kpi,.resbox,.det{border-radius:10px;box-shadow:0 1px 3px rgba(0,59,92,.08)}
.ch{background:#003B5C;border-bottom:3px solid #00AEEF;font-size:11px;letter-spacing:.6px}
.seg button,.vtabs button{border-radius:8px}
.seg button[aria-pressed="true"]{background:#003B5C;border-color:#003B5C}
.chip,.pill{border-radius:10px}
@media (max-width:900px){
 body{padding-left:0}

const $=s=>document.querySelector(s);
const fmt=v=>Math.round(v).toLocaleString("pt-BR");
const est=v=>Math.round(v*RATIO);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rCls=r=>r==="CRÍTICO"?"pill-c":r==="ALTO"?"pill-a":"pill-m";
const chip=(t,c)=>`<span class="chip" style="background:${c}18;color:${c}">${t}</span>`;
function sec(k,t,nt,id){return `<div class="s12 sec"${id?` id="${id}"`:""}><div class="k">${esc(k)}</div><div class="t">${esc(t)}</div><div class="ln"></div><div class="nt">${nt||""}</div></div>`;}
function kpis(list){return `<div class="s12 kpis">`+list.map(k=>`<div class="kpi" style="--cc:${k.c||"var(--accent)"}"><div class="l">${esc(k.l)}</div><div class="v num">${k.v}</div><div class="s">${k.s||""}</div></div>`).join("")+`</div>`;}
function card(span,title,body,hint,headExtra){return `<div class="card ${span}"><div class="ch${headExtra?" chhead":""}"><span>${esc(title)}</span>${headExtra||""}</div><div class="cb">${body}${hint?`<div class="hint">${hint}</div>`:""}</div></div>`;}
function bars(list,labelW){
  const max=Math.max(...list.map(x=>x.v))||1;
  return list.map(x=>`<div class="brow"><div class="lb" style="min-width:${labelW||150}px" title="${esc(x.l)}">${esc(x.l)}</div>${x.uf?`<div class="uf">${esc(x.uf)}</div>`:""}<div class="tr"><span style="width:${(x.v/max*100).toFixed(1)}%;background:${x.c||"var(--accent)"}"></span></div><div class="vl num" style="color:${x.c||"var(--deep)"}">${fmt(x.v)}</div></div>`).join("");
}

function evoInner(){
  const data=S.per==="5a"?EVO_5A:EVO_FULL;
  const sub=data.reduce((s,d)=>s+d.v,0);
  const cps=S.per==="5a"?[
    chip("Total 2020–2026: "+fmt(TOTAL_5A),"#003B5C"),chip("2025: 54.633 (+13,1% YoY)","#F97316"),chip("Crescimento contínuo pós-pandemia","#059669")
  ]:[
    chip("Pico 2017: 69.660","#F97316"),chip("Queda 2018: Reforma Trabalhista (−43,6%)","#EF4444"),chip("Retomada sustentada desde 2021","#059669")
  ];
  const withVar=data.map((d,i)=>{const isP=d.a.includes("p");const prev=i>0?data[i-1].v:null;const yoy=prev&&!isP?((d.v-prev)/prev*100):null;return {...d,yoy,isP};});
  const maxV=Math.max(...data.map(d=>d.v));
  const n=data.length,W=900,barZone=200,topPad=58,botPad=44,H=barZone+topPad+botPad,gap=6;
  const bW=Math.min((W-60-gap*(n-1))/n,64);
  const startX=(W-(n*bW+(n-1)*gap))/2;
  let svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block">`;
  [0,20000,40000,60000,80000].filter(t=>t<=maxV*1.1).forEach(t=>{const y=topPad+barZone-(t/maxV)*barZone;svg+=`<line x1="30" y1="${y.toFixed(1)}" x2="${W-10}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-dasharray="3,3"/><text x="26" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#7c8a9b">${(t/1000).toFixed(0)}K</text>`;});
  withVar.forEach((d,i)=>{
    const x=startX+i*(bW+gap),barH=(d.v/maxV)*barZone,y=topPad+barZone-barH;
    const fill=d.isP?"#9fb3c6":d.yoy!==null&&d.yoy<0?"#EF4444":"#003B5C";
    svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${fill}" opacity="${d.isP?.5:1}"/>`;
    svg+=`<text x="${(x+bW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14324e">${(d.v/1000).toFixed(1).replace(".",",")}K</text>`;
    if(d.yoy!==null){const yt=(d.yoy>=0?"+":"")+d.yoy.toFixed(1)+"%",col=d.yoy>=0?"#1f9d6b":"#EF4444",bg=d.yoy>=0?"#e3f5ec":"#fdecec",bd=d.yoy>=0?"#a7f3d0":"#fecaca",tw=yt.length*5+10,by=Math.max(y-36,2);svg+=`<rect x="${(x+bW/2-tw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${tw}" height="15" rx="7.5" fill="${bg}" stroke="${bd}" stroke-width=".5"/><text x="${(x+bW/2).toFixed(1)}" y="${(by+11).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${col}">${yt}</text>`;}
    svg+=`<text x="${(x+bW/2).toFixed(1)}" y="${(topPad+barZone+15).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="${d.isP?400:600}" fill="${d.isP?"#9fb3c6":"#5b6675"}">${d.a.replace("p","*")}</text>`;
    svg+=`<text x="${(x+bW/2).toFixed(1)}" y="${(topPad+barZone+27).toFixed(1)}" text-anchor="middle" font-size="8" fill="#7c8a9b">${fmt(d.v)}</text>`;
  });
  const pts=withVar.map((d,i)=>({x:startX+i*(bW+gap)+bW/2,y:topPad+barZone-(d.v/maxV)*barZone}));
  svg+=`<path d="M${pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" L")}" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="4,3" opacity=".7"/>`;
  pts.forEach(p=>svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="#F97316" stroke="#fff" stroke-width="1.5"/>`);
  svg+=`</svg>`;
  return `<div class="chips">${cps.join("")}<span class="chip" style="background:var(--track);color:var(--deep);margin-left:auto">Total: ${fmt(sub)} processos</span></div>${svg}`;
}

    const open=S.tema===`${g.id}-${i}`;
    const tag=t.tag?`<span class="tag ed" data-er="${t.rank}" data-ef="tag" onmousedown="edStop(event)" style="background:${g.cor}18;color:${g.cor}">${t.tag}</span>`:"";

        <p class="box ed" data-er="${t.rank}" data-ef="ganha" onmousedown="edStop(event)" style="background:var(--okbg);color:var(--ink)">${t.ganha}</p>
        <div class="sub" style="color:var(--a)">Fatores determinantes para condenação</div>

      <div class="rk" style="color:${i<2?g.cor:'var(--muted)'}">${t.rank}</div>
      <div>
        <h4><span class="ed" data-er="${t.rank}" data-ef="tema" onmousedown="edStop(event)">${esc(t.tema)}</span> ${tag} <span class="pill pill-sm ${rCls(t.risco)}">${t.risco}</span></h4>
        <p class="rs ed" data-er="${t.rank}" data-ef="resumo" onmousedown="edStop(event)">${t.resumo}</p>
        ${det}
      </div>
      <div class="rt"><div style="margin-bottom:5px"><span class="pill ${rCls(t.risco)}">${t.pct}%</span></div><div class="tr" style="width:90px;margin-left:auto;height:6px;background:var(--track);border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${(t.pct/maxPct*100).toFixed(0)}%;background:${g.cor};border-radius:3px"></span></div><div style="font-size:9.5px;color:var(--muted);margin-top:4px">${open?"fechar":"ver análise"}</div></div>
    </div>`;
  }).join("");
  return gtabs+`<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden"><div style="padding:11px 16px;background:${g.cor}0d;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><div><div style="font-size:13px;font-weight:800;color:${g.cor}">${esc(g.label)}</div><div style="font-size:12px;color:var(--muted2)">${esc(g.sub)}</div></div><div style="font-size:11px;color:var(--muted)">Incidência por projeção · DataJud/CNJ</div></div>${rows}</div>`;
}
function normasInner(){
  const clau=NM_CLAUS.map(c=>`<div class="ncl s4" style="--cc:${c.c}"><div class="g">${esc(c.g)}</div><h4>${esc(c.t)}</h4><div class="val">${c.v}</div><div class="rs">${esc(c.s)}</div><details><summary>Texto e detalhes da cláusula</summary><div class="tx">${esc(c.tx)}</div></details><div class="src">Fonte: ${esc(c.src)}</div></div>`).join("");
  const banks=NM_BANKS.map(b=>`<div class="bnk s4" style="--cc:${b.c}"><div class="nm">${esc(b.nm)}</div><div class="tp">${esc(b.tp)}</div><div class="tags">${b.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div><div class="mm">${esc(b.mm)}</div><div class="lk">${b.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div></div>`).join("");
  const src=NM_LINKS.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${esc(l.t)} ↗</a>`).join("");
  return {clau,banks,src};
}

// ─── RENDER POR ABA ──────────────────────────────────────────
function renderPanorama(){
  const lb=S.per==="5a"?"2020 a 2026":"2014 a 2026";
  const tot=S.per==="5a"?TOTAL_5A:TOTAL_FULL;
  const pJ=S.per==="5a"?est(305939):305939, pD=S.per==="5a"?est(128875):128875;
  let h=sec("Visão geral","Panorama do contencioso bancário","Volume CSJT (CNAE 64.22-1-00) · conteúdo DataJud/CNJ 2020–2026","sec-panorama");
  h+=kpis([
    {l:"Total processos",v:fmt(tot),s:lb+" · distribuídos",c:"var(--deep)"},
    {l:"Pedidos jornada",v:fmt(pJ),s:S.per==="5a"?"proporcional":"núcleo de jornada (54,6%)",c:"#F97316"},
    {l:"Pedidos danos",v:fmt(pD),s:S.per==="5a"?"proporcional":"dano moral + assédio (23%)",c:"#EF4444"},
    {l:"Acordos",v:"133.651",s:"23,9% antes da sentença",c:"var(--warn)"}
  ]);
  h+=card("s12","Processos distribuídos por ano",evoInner(),"2026: dado parcial (jan–mai) · Fonte: CSJT · CNAE 64.22-1-00",segPer());
  h+=card("s12","Resultados dos casos",resultadosInner());
  return h;
}
function renderContencioso(){
  let h=sec("Distribuição","Onde tramita e contra quem","Base DataJud/CNJ · 136.670 processos bancários · 2020–2026","sec-contencioso");
  h+=card("s12","Distribuição por TRT — 24 tribunais",trtInner());
  h+=card("s6","Causa raiz dos processos",causaInner());
  h+=card("s6","Pedidos principais",pedidoInner());
  h+=card("s6","Top 10 advogados · parte passiva",advsInner(),"3 dos 5 maiores volumes atuam em SP; 2 no Paraná");
  h+=card("s6","Principais bancos · parte passiva",bancosInner(),"Fonte: CSJT · CNAE 64.22-1-00",segBanco());
  return h;
}
function renderTeses(){
  const ec=`<div class="seg" style="gap:8px"><button class="ebtn${window.EDIT?" on":""}" onclick="toggleEdit()">${window.EDIT?"Concluir edição":"Editar textos"}</button>${window.EDIT?`<button class="ebtn" onclick="edRestore()">Restaurar original</button>`:""}</div>`;
  let h=sec("Teses & Defesa","Avaliação de causa raiz","Projeção por incidência · DataJud/CNJ sobre base CSJT","sec-teses");
  h+=card("s12","Grupos de pedidos e fundamentação jurídica",temasInner(),null,ec);
  h+=`<div class="s12"><div class="note"><b>NOTA METODOLÓGICA</b><br>A classificação de conteúdo resulta da análise de 90.347 processos do DataJud/CNJ (2020–2026), projetada sobre o volume nacional do CSJT. As porcentagens representam incidência nos processos e podem superar 100%, já que um mesmo processo cumula múltiplos pedidos. Em "Horas Extras", foram agrupados os pedidos de adicional (24,8% dos processos trazem ambas as etiquetas do CNJ) e reflexos (acessório em 80% dos casos). O núcleo de jornada deriva do enquadramento no art. 224 da CLT — 6 horas do escriturário versus 8 horas do cargo de confiança do §2º.</div></div>`;
  return h;
}
function renderNormas(){
  const {clau,banks,src}=normasInner();
  let h=sec("Bancários","Normas coletivas dos bancos","CCT Nacional (FENABAN × CONTRAF-CUT) e ACTs dos grandes bancos · data-base 1º/09","sec-normas");
  h+=`<div class="s12"><div class="banner"><div class="em">📄</div><div style="flex:1;min-width:280px"><div class="t1">Convenção Coletiva Nacional dos Bancários e Acordos Coletivos dos grandes bancos</div><div class="t2">O arcabouço coletivo que sustenta as teses de jornada, PLR e remuneração. Vigência 01/09/2024–31/08/2026 · Campanha 2026: reajuste de 4,6%. Valores conferidos nas fontes oficiais do Sindicato dos Bancários.</div></div></div></div>`;
  h+=kpis([
    {l:"Reajuste 2026",v:"4,6%",s:"INPC 3,98% + 0,6% real",c:"var(--ok)"},
    {l:"Reajuste 2024",v:"4,5%",s:"1º ano da CCT",c:"var(--muted2)"},
    {l:"Vale-refeição",v:'R$ 1.227<small>/mês</small>',s:"R$ 14.727/ano",c:"var(--accent)"},
    {l:"Vale-alimentação",v:'R$ 967<small>/mês</small>',s:"+ 13ª cesta · R$ 12.571/ano",c:"var(--accent)"},
    {l:"PLR · adicional",v:"2,2%",s:"do lucro líquido, linear",c:"var(--deep)"},
    {l:"Jornada",v:"6h",s:"8h p/ cargo de confiança",c:"#F97316"}
  ]);
  h+=sec("CCT Nacional","Cláusulas-chave","Resumo por cláusula com valor e o texto integral consultável");
  h+=clau;
  h+=sec("Por banco","Acordos coletivos dos grandes bancos","Cada banco aplica a CCT nacional; os grandes negociam ACTs e programas próprios");
  h+=banks;
  h+=card("s12","Fontes e íntegra das normas",`<div class="nsrc">${src}</div><div class="hint">Links para a íntegra oficial (Sindicato dos Bancários de São Paulo · Sistema Mediador/MTE). Reajuste, VR, VA e PLR conferidos nas fontes oficiais; piso, auxílio-creche, gratificação de caixa e ATS trazem a regra, com o valor exato a conferir na íntegra. Posição: setembro/2026.</div>`);
  return h;
}

// ─── INTERAÇÕES ──────────────────────────────────────────────
function render(){
  const y=window.scrollY;
  $("#main").innerHTML=`<div class="grid">${renderPanorama()}${renderContencioso()}${renderTeses()}${renderNormas()}</div>`;
  if(window.EDIT)applyEditable();
  $("#hpos").textContent=S.per==="5a"?"2020–2026 · CSJT":"2014–2026 · CSJT";
  window.scrollTo(0,y);
}
function setPer(p){S.per=p;render();}
function setBanco(b){S.banco=b;render();}
function setGrupo(id){S.grupo=id;S.tema=null;render();}
function toggleTema(g,i){const k=`${g}-${i}`;const opening=S.tema!==k;S.tema=opening?k:null;render();if(opening)setTimeout(()=>{const t=document.querySelectorAll(".tema")[i];if(t)t.scrollIntoView({behavior:"smooth",block:"center"});},30);}

// ─── EDIÇÃO DE TEXTOS ────────────────────────────────────────
window.EDIT=false;
const OVKEY="pc_bank_edit_v1";
function temaByRank(r){for(const g of GRUPOS)for(const t of g.temas)if(String(t.rank)===String(r))return t;return null;}
function loadOverrides(){let ov={};try{ov=JSON.parse(localStorage.getItem(OVKEY)||"{}");}catch(e){ov={};}window.__OV=ov;}
function applyOverrides(){const ov=window.__OV||{};Object.keys(ov).forEach(r=>{const t=temaByRank(r);if(!t)return;const o=ov[r];["tema","tag","resumo","contexto","ganha","perde"].forEach(f=>{if(o[f]!=null)t[f]=o[f];});if(o.base)Object.keys(o.base).forEach(bi=>{if(t.baseLegal&&t.baseLegal[bi]!=null)t.baseLegal[bi]=o.base[bi];});});}
function saveOverride(r,f,val,bi){const ov=window.__OV||(window.__OV={});ov[r]=ov[r]||{};if(f==="base"){ov[r].base=ov[r].base||{};ov[r].base[bi]=val;}else ov[r][f]=val;try{localStorage.setItem(OVKEY,JSON.stringify(ov));}catch(e){}const t=temaByRank(r);if(t){if(f==="base"){if(t.baseLegal)t.baseLegal[bi]=val;}else t[f]=val;}}
function edStop(e){if(window.EDIT)e.stopPropagation();}
function applyEditable(){document.querySelectorAll("#main .ed").forEach(el=>el.contentEditable=window.EDIT?"true":"false");}
document.addEventListener("input",e=>{if(!window.EDIT)return;const el=e.target;if(el&&el.dataset&&el.dataset.ef)saveOverride(el.dataset.er,el.dataset.ef,el.innerText.trim(),el.dataset.ei);});
function toggleEdit(){window.EDIT=!window.EDIT;render();}
function edRestore(){if(!confirm("Restaurar todos os textos originais? As edições salvas serão apagadas."))return;try{localStorage.removeItem(OVKEY);}catch(e){}window.__OV={};location.reload();}

// ─── INIT ────────────────────────────────────────────────────
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const el=document.getElementById(b.dataset.goto);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
loadOverrides();applyOverrides();
render();
</script>
