:root{--navy:#0b2233;--navy2:#0e2841;--side:#0a1d2e;--ac:#00a3d9;--ac2:#3b8fd9;--ink:#33475d;--muted:#6a7d90;--line:#dfe7ef;--bg:#f2f6fa;--card:#fff;--soft:#e6f4fb;
--baixo:#1f8a5b;--mod:#d99a1e;--alto:#c0483a;--baixoBg:#e3f4ea;--modBg:#fdf1d8;--altoBg:#fbe2de;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Figtree','Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100%}
aside{background:var(--side);color:#c7d5e2;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:22px 14px}
aside .brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
aside .brand img{height:48px;display:block}
aside .brand .pn{margin-top:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);font-weight:800}
aside .brand .pt{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.navg{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6f88a0;font-weight:800;margin:16px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:#c7d5e2}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(0,163,217,.22),rgba(0,163,217,.06));color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav .tag{margin-left:auto;font-size:10px;font-weight:800;background:rgba(0,163,217,.18);color:#7fd3f0;border-radius:10px;padding:1px 7px}
aside .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f97ad}
main{min-width:0;padding:26px 32px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.15}
.top p{color:var(--muted);margin-top:3px;max-width:70ch}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--navy)}
.chip.demo{background:#fff6e5;border-color:#f1d9a6;color:#8a5a00;font-weight:700}
.chip select{border:0;background:transparent;font-weight:700;color:var(--navy);outline:none}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h3{font-size:14px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card h3 small{font-size:11px;font-weight:600;color:var(--muted)}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.kpi.hot b{color:var(--alto)}
.bar{height:9px;border-radius:6px;background:#edf2f7;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.dimrow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 40px max-content;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #eef2f6;font-size:13px}
.dimrow:last-child{border-bottom:0}
.dimrow b{font-variant-numeric:tabular-nums;color:var(--navy);text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-align:center;white-space:nowrap}
.p-baixo{background:var(--baixoBg);color:var(--baixo)}.p-moderado{background:var(--modBg);color:#9a6a0b}.p-alto{background:var(--altoBg);color:var(--alto)}
.p-info{background:var(--soft);color:#06739a}.p-gray{background:#eef2f6;color:var(--muted)}
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px;vertical-align:bottom;line-height:1.2}
.heat th:first-child{text-align:left}
.heat td{text-align:center;border-radius:6px;padding:8px 2px;font-weight:700;font-variant-numeric:tabular-nums}
.heat td.l{text-align:left;background:none;color:var(--navy);font-weight:700;white-space:nowrap;padding-right:10px}
.scroll{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
.tb td{padding:10px;border-bottom:1px solid #eef2f6;vertical-align:top}
.tb td.k{font-weight:700;color:var(--navy)}
.tb input,.tb select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.btn{cursor:pointer;border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--navy2);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn.ac{background:var(--ac)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:focus-visible,.nav button:focus-visible,.lk label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.hero{background:linear-gradient(120deg,var(--navy2),#0d3a5c);color:#fff;border-radius:18px;padding:22px 26px;position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(0,163,217,.55),transparent 70%)}
.hero h2{font-size:20px;font-weight:800;position:relative}.hero p{color:#bcd0e2;position:relative;max-width:72ch;margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px;position:relative}
.steps div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;cursor:pointer}
.steps div:hover{background:rgba(255,255,255,.13)}
.steps b{display:block;color:var(--ac);font-size:18px;font-weight:800;line-height:1}.steps strong{display:block;font-size:12.5px;margin-top:4px}.steps small{font-size:11px;color:#a9bfd3}
.steps .ok{position:absolute;right:8px;top:8px}
/* formulários */
.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prog{flex:1;min-width:200px;max-width:420px}.prog .bar{height:8px}.prog small{color:var(--muted);font-size:12px}
.sec{margin-top:18px}.sec h4{font-size:15px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h4 small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);font-weight:800}
.lk{display:grid;grid-template-columns:28px minmax(0,1fr) repeat(var(--n),minmax(46px,64px));gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f6}
.lk.hd{border-bottom:2px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:center;line-height:1.15;padding:6px 0}
.lk .n{font-weight:800;color:var(--ac)}
.lk label{display:flex;justify-content:center;cursor:pointer;border-radius:50%}
.lk input{appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid #a9bacb;cursor:pointer;transition:.12s}
.lk input:checked{border-color:var(--ac);background:radial-gradient(circle,var(--ac) 45%,#fff 50%)}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt label{border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;background:#fff;font-size:13px}
.opt input{display:none}.opt label:has(input:checked){background:var(--soft);border-color:var(--ac);color:#06739a;font-weight:700}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;background:#fff}
.note{background:var(--soft);border:1px solid #bfe3f3;border-radius:12px;padding:12px 14px;font-size:13px;color:#0b4f6c}
.note.warn{background:#fff6e5;border-color:#f1d9a6;color:#7a5200}
.note.red{background:#fdf0ee;border-color:#f2c3bc;color:#7d2a20}
.toast{position:fixed;right:24px;bottom:24px;background:var(--navy2);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:700;transform:translateY(120px);transition:.3s;z-index:9}
.toast.on{transform:none}
.nps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.nps label{border:1.5px solid var(--line);border-radius:9px;text-align:center;padding:8px 0;font-weight:800;cursor:pointer;color:var(--navy);background:#fff}
.nps input{display:none}.nps label:has(input:checked){background:var(--ac);border-color:var(--ac);color:#fff}
.mx{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:6px}
.mx .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;text-align:center}
.mx .c{border-radius:12px;min-height:96px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.mx .c span{background:rgba(255,255,255,.85);border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700;color:var(--navy)}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lib .card{display:flex;flex-direction:column;gap:6px}.lib .card b{color:var(--navy);font-size:15px}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative;margin-top:8px}
.tl div{padding:28px 10px 0 0;position:relative;font-size:12.5px}
.tl div::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:var(--line)}
.tl div::after{content:"";position:absolute;left:0;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--ac)}
.tl div.done::after{background:var(--ac)}.tl div.done::before{background:var(--ac)}
.tl b{display:block;color:var(--navy)}.tl small{color:var(--muted)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kan .col{background:#e9eff5;border-radius:14px;padding:12px}
.kan .col h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.kan .it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;font-size:13px}
.kan .it b{color:var(--navy);display:block;margin-bottom:3px}.kan .it .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--muted)}
.kan .it select{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.view{display:none}.view.on{display:block;animation:fd .25s ease}
@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.mobilebar{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g3{grid-template-columns:1fr}.steps,.tl{grid-template-columns:repeat(3,minmax(0,1fr))}.lib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:.25s}aside.open{transform:none}
.mobilebar{display:flex;align-items:center;justify-content:space-between;background:var(--side);padding:10px 16px;position:sticky;top:0;z-index:10}.mobilebar img{height:34px}
main{padding:18px 16px 40px}.g4,.g2,.lib,.kan{grid-template-columns:1fr}.dimrow{grid-template-columns:minmax(0,1fr) 70px 40px}.dimrow .pill{display:none}
.lk{grid-template-columns:22px minmax(0,1fr);}.lk .opts5{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--n),1fr)}.lk.hd{display:none}.steps,.tl{grid-template-columns:repeat(2,minmax(0,1fr))}}

const EMP = {razao:'Empresa Demonstração S.A.', cnpj:'00.000.000/0001-00', unidade:'Matriz · São Paulo/SP', resp:'Responsável técnico de SST', data:new Date().toISOString().slice(0,10)};
function docHTML(){
  const dm=dimMeans('Todas'), rows=invRows(), n=dm[0].n, d8=EMP.data.split('-').reverse().join('/');
  const css=`body{font-family:Figtree,Segoe UI,Arial,sans-serif;color:#33475d;font-size:10.5pt;line-height:1.5;margin:0}h1{font-size:22pt;color:#0b2233;margin:0 0 4px}h2{font-size:13.5pt;color:#0b2233;margin:22px 0 8px;border-bottom:2px solid #00a3d9;padding-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:9pt;margin:6px 0 10px}th{background:#0e2841;color:#fff;text-align:left;padding:6px;font-size:8pt}td{border-bottom:1px solid #dfe7ef;padding:6px;vertical-align:top}
  .meta td{border:0;padding:2px 8px 2px 0}.k{font-weight:700;color:#0b2233}.p{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:700;font-size:8.5pt}.alto{background:#fbe2de;color:#c0483a}.moderado{background:#fdf1d8;color:#9a6a0b}.baixo{background:#e3f4ea;color:#1f8a5b}
  .head{background:#0e2841;color:#fff;padding:18px 22px;border-radius:12px;margin-bottom:14px}.head small{color:#7fd3f0;letter-spacing:.14em;text-transform:uppercase;font-weight:800;font-size:8pt}.head h1{color:#fff}
  .sig{display:flex;gap:30px;margin-top:40px}.sig div{flex:1;border-top:1px solid #0b2233;padding-top:4px;font-size:9pt}@page{size:A4;margin:16mm}`;
  const b=`<div class="head"><img src="${document.querySelector('aside .brand img').src}" style="height:40px"><br><small>NR-01 · NR-17 · Gerenciamento de riscos ocupacionais</small><h1>Avaliação dos fatores de risco psicossociais relacionados ao trabalho</h1>AEP psicossocial, inventário de riscos e plano de ação para o PGR</div>
  <table class="meta"><tr><td class="k">Empresa</td><td>${esc(EMP.razao)}</td><td class="k">CNPJ</td><td>${esc(EMP.cnpj)}</td></tr><tr><td class="k">Unidade</td><td>${esc(EMP.unidade)}</td><td class="k">Data</td><td>${d8}</td></tr><tr><td class="k">Responsável</td><td colspan="3">${esc(EMP.resp)}</td></tr></table>
  <h2>1. Base normativa</h2><p>${esc(D.norma.portarias)}. Subitem 1.5.3.1.4 da NR-1 (GRO abrange os fatores de risco psicossociais relacionados ao trabalho) e subitem 1.5.3.2.1 (condições de trabalho nos termos da NR-17). Referências oficiais: ${esc(D.norma.guia)}; ${esc(D.norma.manual)}; ${esc(D.norma.pr)}.</p>
  <h2>2. Metodologia e critérios de avaliação (subitem 1.5.4.4.2.2)</h2><p>Identificação e avaliação realizadas por meio da Avaliação Ergonômica Preliminar (AEP), considerando a atividade real, com: (i) questionário anônimo de percepção organizado pelos 13 fatores do guia do MTE, aplicado após comunicação prévia aos trabalhadores, com ${n} respondentes; (ii) verificação de indicadores objetivos (jornada, afastamentos, relatos, PCMSO); (iii) análise das medidas de prevenção existentes. ${esc(D.norma.fundamentacao)}. O questionário não é obrigatório pela NR-1; foi adotado com garantia de anonimato e participação dos trabalhadores, conforme o Manual do GRO (MTE, 2026) e o item 17.3.8 da NR-17.</p>
  <p><b>Exigência da atividade</b>: média por fator de 1 a 5 (5 é o mais favorável); até 2,4 alta, de 2,5 a 3,4 moderada, a partir de 3,5 baixa. <b>Probabilidade</b> (subitem 1.5.4.4.5.3): combina a exigência com a eficácia das medidas existentes. <b>Severidade</b>: a partir das consequências indicadas no guia do MTE. <b>Nível de risco</b> (subitem 1.5.4.4.2): matriz severidade x probabilidade com resultados baixo, moderado e alto. Resultados de grupos com menos de 5 respondentes não são apresentados.</p>
  <h2>3. Participação dos trabalhadores</h2><p>Os trabalhadores foram informados previamente do objetivo, do anonimato e do uso dos resultados, responderam ao questionário e participarão do acompanhamento das medidas, com a CIPA, se houver. Os dados são tratados de forma agregada, nos termos da LGPD.</p>
  <h2>4. Resultados por fator</h2><table><tr><th>Fator de risco (guia do MTE)</th><th>Média</th><th>Exigência</th><th>Medidas existentes</th><th>Probabilidade</th><th>Severidade</th><th>Risco</th></tr>${dm.map(x=>{const p=prob(x.m,x.di),c=classif(p,x.d.sev);return `<tr><td class="k">${esc(x.d.nome)}</td><td>${fmt(x.m)}</td><td>${['','Baixa','Moderada','Alta'][exig(x.m)]}</td><td>${MEDIDAS[x.di]}</td><td>${['','Baixa','Média','Alta'][p]}</td><td>${['','Baixa','Média','Alta'][x.d.sev]}</td><td><span class="p ${c}">${NIV[c]}</span></td></tr>`}).join('')}</table>
  <h2>5. Inventário de riscos psicossociais (subitem 1.5.7.3.2)</h2><p><b>a) Processos e ambientes:</b> ${esc(EMP.unidade)}, atividades de escritório e atendimento, em regime presencial, híbrido e remoto.</p>
  <table><tr><th>e) Grupo</th><th>b) Atividades</th><th>c) Perigo</th><th>d) Agravos</th><th>g) Exposição</th><th>f) Medidas</th><th>h) AEP</th><th>i) Risco</th></tr>${rows.map(r=>`<tr><td class="k">${r.a}</td><td>${esc(ATIV[r.a])}</td><td>${esc(r.x.d.nome)}</td><td>${esc(r.x.d.agr)}</td><td>Exigência ${['','baixa','moderada','alta'][exig(r.x.m)]}</td><td>${MEDIDAS[r.x.di]}</td><td>Média ${fmt(r.x.m)}</td><td><span class="p ${r.c}">${NIV[r.c]}</span></td></tr>`).join('')}</table>
  <h2>6. Plano de ação (subitem 1.5.5.2.2)</h2><p>Medidas na ordem de prioridade dos subitens 1.4.1, alínea g, e 1.5.5.1.2, com preferência por mudanças na organização do trabalho.</p><table><tr><th>Risco</th><th>Medida de prevenção</th><th>Tipo</th><th>Responsável</th><th>Prazo</th><th>Acompanhamento e aferição</th><th>Status</th></tr>${PLANO.map(p=>`<tr><td>${esc(p.r)}</td><td class="k">${esc(p.m)}</td><td>${esc(p.tipo)}</td><td>${esc(p.resp)}</td><td>${p.prazo.split('-').reverse().join('/')}</td><td>${esc(p.ind)}</td><td>${p.st}</td></tr>`).join('')}</table>
  <h2>7. Acompanhamento e revisão</h2><p>Pulso trimestral para verificar a eficácia das medidas; revisão da avaliação após a implementação das medidas (subitem 1.5.4.4.6) e, no máximo, a cada 2 anos ou antes, diante de mudanças organizacionais, adoecimentos relacionados, relatos de assédio ou violência; integração com o PCMSO; retorno dos resultados aos trabalhadores.</p>
  <div class="sig"><div>Responsável pelo PGR / AEP</div><div>Representante da empresa</div><div>Data</div></div>`;
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AEP psicossocial - ${esc(EMP.razao)}</title><style>${css}</style></head><body>${b}</body></html>`;}
V.documento = () => `<div class="grid g21"><div class="card"><h3>Dados da empresa <small>aparecem no cabeçalho do documento</small></h3>
  <div class="grid g2">${[['razao','Razão social'],['cnpj','CNPJ'],['unidade','Unidade / estabelecimento'],['resp','Responsável técnico (SST)'],['data','Data','date']].map(f=>`<label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--navy)">${f[1]}<input class="in" data-emp="${f[0]}" type="${f[2]||'text'}" value="${esc(EMP[f[0]])}"></label>`).join('')}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn ac" id="docPrint">Abrir para imprimir ou salvar em PDF</button><button class="btn" id="docWord">Baixar em Word</button><button class="btn ghost" id="docHtml">Baixar em HTML</button></div></div>
  <div class="card"><h3>O que o documento contém</h3>${['Base normativa (NR-01, NR-17, guia e Manual do GRO do MTE)','Metodologia e critérios de avaliação documentados','Participação dos trabalhadores e LGPD','Resultado dos 13 fatores com classificação do risco','Inventário com os itens a a i do subitem 1.5.7.3.2','Plano de ação com cronograma e aferição','Acompanhamento, revisão e assinaturas'].map(x=>`<div class="dimrow" style="grid-template-columns:1fr auto"><span>${x}</span><span class="pill p-baixo">incluído</span></div>`).join('')}
  <p class="note" style="margin-top:10px">Tudo vem das respostas, da avaliação e do plano da plataforma. Mudou algo nas outras abas? O documento já sai atualizado.</p></div></div>
  <div class="card" style="margin-top:16px"><h3>Pré-visualização</h3><iframe id="docPrev" title="Pré-visualização do documento" style="width:100%;height:720px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe></div>
  <style>.in{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;font-weight:400;color:var(--ink)}</style>`;
V.documento.bind = () => {
  const prev=()=>{$('#docPrev').srcdoc=docHTML();}; prev();
  document.querySelectorAll('[data-emp]').forEach(i=>i.oninput=()=>{EMP[i.dataset.emp]=i.value;prev();});
  const dl=(txt,nome,tipo)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',txt],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();a.remove();};
  const base='AEP psicossocial - '+EMP.razao.replace(/[\\/:*?"<>|]/g,'');
  $('#docPrint').onclick=()=>{const w=window.open('','_blank');if(!w){toast('Libere pop-ups para abrir o documento.');return;}w.document.write(docHTML());w.document.close();setTimeout(()=>w.print(),600);};
  $('#docWord').onclick=()=>{dl(docHTML(),base+'.doc','application/msword');toast('Documento em Word baixado.');};
  $('#docHtml').onclick=()=>{dl(docHTML(),base+'.html','text/html');toast('Documento baixado.');};
};

// ---------- navegação ----------
function nav(){ $('#nav').innerHTML = VIEWS.map(v=>v.g?`<div class="navg">${v.g}</div>`:`<div class="nav"><button data-v="${v.id}"><svg viewBox="0 0 24 24">${ICON[v.i]}</svg>${v.t}${v.tag?`<span class="tag">${v.tag}</span>`:''}</button></div>`).join('');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{go(b.dataset.v);$('#side').classList.remove('open');}); }
let CUR='painel';
const SUB = {documento:'AEP psicossocial, inventário de riscos e plano de ação gerados a partir das respostas, prontos para o PGR.',painel:'Resultado consolidado da consulta aos trabalhadores e situação do gerenciamento de riscos.',questionario:'Parte A · consulta aos trabalhadores sobre os fatores de risco psicossociais.',pulso:'Acompanhamento trimestral, versão curta.',lideranca:'Autoavaliação de sócios, gestores e coordenadores.',assedio:'Questionário confidencial sobre assédio moral, assédio sexual e violência.',checklist:'Parte B · fatores de risco a partir de dados objetivos.',avaliacao:'Parte C · classificação do risco por probabilidade e severidade.',inventario:'Parte D · riscos psicossociais para o inventário do PGR.',plano:'Parte E · medidas de prevenção, responsáveis e prazos.',cronograma:'Parte F · acompanhamento, comunicação e revisão.',biblioteca:'Fontes oficiais, questionários validados no Brasil e correspondência com a NR-01.'};
function render(id){ const v=VIEWS.find(x=>x.id===id); const filt=['painel','avaliacao'].includes(id);
  $('#main').innerHTML = `<div class="top"><div><h1>${v.t}</h1><p>${SUB[id]}</p></div><div class="chips"><span class="chip demo">Dados de demonstração</span><span class="chip">Empresa Demonstração S.A.</span>${filt?`<span class="chip">Área <select id="areaSel" aria-label="Filtrar área">${['Todas',...AREAS].map(a=>`<option ${a===AREA?'selected':''}>${a}</option>`).join('')}</select></span>`:''}<span class="chip">Ciclo 2026</span></div></div><section class="view on">${V[id]()}</section>`;
  if(V[id].bind) V[id].bind();
  if($('#areaSel')) $('#areaSel').onchange=e=>{AREA=e.target.value;render(id);};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){CUR=id;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===id));render(id);window.scrollTo(0,0);try{history.replaceState(null,'','#'+id)}catch(e){}}
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
nav(); go((location.hash||'').slice(1) in V ? location.hash.slice(1) : 'painel');
</script></body></html>
